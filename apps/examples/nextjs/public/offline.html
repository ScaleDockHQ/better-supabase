<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Acme Cloud</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      main {
        display: grid;
        gap: 12px;
        max-width: 22rem;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 16px;
      }
      p {
        margin: 0;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Acme Cloud needs a connection to load your workspace. This page reloads
        when you are back online.
      </p>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
