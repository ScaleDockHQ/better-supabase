# @generated by better-supabase powersync streams. Do not edit; run `better-supabase powersync streams` instead.
config:
  edition: 3

streams:
  memberships_memberships:
    auto_subscribe: true
    query: "SELECT organization_id || ':' || user_id AS id, * FROM better_supabase.memberships WHERE user_id = auth.user_id() AND disabled_at IS NULL"
  memberships_organizations:
    auto_subscribe: true
    query: "SELECT id, name, slug, disabled_at, deleted_at FROM better_supabase.organizations WHERE id IN (SELECT organization_id FROM better_supabase.memberships WHERE user_id = auth.user_id() AND disabled_at IS NULL)"
  notifications_recipients:
    auto_subscribe: true
    query: "SELECT * FROM better_supabase.notification_recipients WHERE user_id = auth.user_id()"
  notifications_events:
    auto_subscribe: true
    query: "SELECT * FROM better_supabase.notification_events WHERE id IN (SELECT event_id FROM better_supabase.notification_recipients WHERE user_id = auth.user_id())"
  notifications_preferences:
    auto_subscribe: true
    query: "SELECT * FROM better_supabase.notification_preferences WHERE user_id = auth.user_id()"
  attachments:
    auto_subscribe: true
    with:
      active_orgs: "SELECT organization_id FROM better_supabase.memberships WHERE user_id = auth.user_id() AND disabled_at IS NULL"
      reader_orgs: "SELECT organization_id FROM better_supabase.memberships WHERE user_id = auth.user_id() AND (role = 'admin' OR role = 'member')"
    query: "SELECT * FROM better_supabase.attachments WHERE tenant_id IN active_orgs AND tenant_id IN reader_orgs"
