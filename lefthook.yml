pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.{js,ts,tsx,mjs,cjs,mts,json,jsonc,yml,yaml}'
      exclude: '{.agents,.cursor,.claude}/**'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts,tsx,mjs,cjs,mts}'
      exclude: '{.agents,.cursor,.claude}/**'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    affected:
      env:
        TURBO_SCM_BASE: origin/main
      run: pnpm exec turbo run lint typecheck test --affected
