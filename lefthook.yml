# Hooks stay narrow: format the staged files, then `pnpm check` on what the branch changed
# (format, lint, typecheck, the tests that mirror or import those files). Full `pnpm verify`
# runs in CI only (docs/decisions/0686-ci-runs-the-full-gate.md). Each job has a time limit so
# a hung linter fails the hook instead of stalling it.
pre-commit:
  piped: true
  skip:
    - merge
    - rebase
  jobs:
    - name: fix
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,md,mdx,css,yml,yaml}"
      exclude:
        - "{.agents,.cursor,.claude}/**"
        - "tests/validation-*/src/wiring/*.generated.ts"
        - "tests/types/*/*.generated.ts"
        - "apps/examples/**/lib/supabase/*.generated.ts"
        - "apps/examples/**/lib/supabase/generated.*"
        - "apps/examples/**/lib/supabase/blocks/slices.ts"
        - "tests/types/**/generated.*"
        - "tests/types/**/blocks.config.ts"
        - "apps/examples/**/lib/supabase/blocks.config.ts"
        - "tests/validation-*/src/blocks.config.ts"
        - "tests/validation-*/src/wiring/*.blocks.config.ts"
        - "**/database.types.ts"
        - "supabase/snapshot.json"
        - "packages/better-supabase/src/preset/catalog.generated.ts"
        - "packages/better-supabase/src/blocks/hint-codes.generated.ts"
        - "packages/better-supabase/src/blocks/name-registry.generated.ts"
        - "packages/better-supabase/src/cli/error-codes.data.ts"
      timeout: 120s
      run: node_modules/.bin/ultracite fix {staged_files}
      stage_fixed: true
    - name: check
      timeout: 300s
      run: node scripts/check-changed.ts

commit-msg:
  jobs:
    - name: commitlint
      timeout: 30s
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  jobs:
    - name: check
      timeout: 300s
      run: node scripts/check-changed.ts
