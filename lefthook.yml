pre-commit:
  parallel: true
  jobs:
    - name: fix
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,md,mdx,css,yml,yaml}"
      exclude:
        - "{.agents,.cursor,.claude}/**"
        - "tests/validation-*/src/wiring/*.generated.ts"
        - "tests/types/*/*.generated.ts"
        - "apps/examples/**/lib/supabase/*.generated.ts"
        - "supabase/snapshot.json"
      run: pnpm exec ultracite fix {staged_files}
      stage_fixed: true
    - name: lint
      run: pnpm exec turbo run lint lint:root --affected

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: affected
      env:
        TURBO_SCM_BASE: origin/main
      run: pnpm exec turbo run lint lint:root typecheck test --affected
