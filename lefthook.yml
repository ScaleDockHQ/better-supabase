# Tests stay out of the hooks; CI runs them (docs/decisions/0108-dev-and-ci-performance.md).
# The `affected` jobs are `pnpm gate`, called through the binary to skip pnpm's startup; keep the
# two in sync.
pre-commit:
  piped: true
  skip:
    - merge
    - rebase
  jobs:
    - name: fix
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,md,mdx,css,yml,yaml}"
      exclude:
        - "{.agents,.cursor,.claude}/**"
        - "tests/validation-*/src/wiring/*.generated.ts"
        - "tests/types/*/*.generated.ts"
        - "apps/examples/**/lib/supabase/*.generated.ts"
        - "apps/examples/**/lib/supabase/generated.*"
        - "tests/types/**/generated.*"
        - "**/database.types.ts"
        - "supabase/snapshot.json"
        - "packages/better-supabase/src/preset/catalog.generated.ts"
        - "packages/better-supabase/src/blocks/hint-codes.generated.ts"
        - "packages/better-supabase/src/blocks/name-registry.generated.ts"
      run: node_modules/.bin/ultracite fix {staged_files}
      stage_fixed: true
    - name: affected
      env:
        TURBO_SCM_BASE: origin/main
      run: >-
        node_modules/.bin/turbo run lint lint:root typecheck --affected
        --cache=local:rw,remote:r --output-logs=errors-only --continue=dependencies-successful

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  jobs:
    - name: affected
      env:
        TURBO_SCM_BASE: origin/main
      run: >-
        node_modules/.bin/turbo run lint lint:root typecheck --affected
        --cache=local:rw,remote:r --output-logs=errors-only --continue=dependencies-successful
