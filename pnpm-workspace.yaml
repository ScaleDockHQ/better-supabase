catalogs:
  ts6:
    typescript: 6.0.3
  # The first release with content mappers, type-checked in tests/types/ts-7.1
  # and apps/examples/content-mapper while the toolchain stays on 7.0
  # (docs/decisions/0097).
  ts71:
    typescript: 7.1.0-beta
  # Ranges for the published packages' runtime dependencies, so an app's
  # supabase-js and better-supabase share one copy of each.
  deps:
    "@standard-schema/spec": "^1.1.0"
    "@supabase/middleware": "^1.0.0"
    # The floor of the @supabase/supabase-js peer, which pins postgrest-js exactly.
    "@supabase/postgrest-js": "^2.119.0"
    "@supabase/server": "^1.9.2"
    "@supabase/ssr": "^0.12.7"
  # Ranges the published packages declare as peers, so consumers pick the
  # version. They are deliberately not exact pins. Each floor is the newest
  # release that was older than minimumReleaseAge when it was set, which is the
  # release the default catalog pins and the tests run (ADR 0848). Each range
  # covers one major, or one minor for a 0.x package; the exceptions say why.
  peers:
    # The AI SDK set moves together: @ai-sdk/react and @ai-sdk/workflow pin ai
    # exactly, and all of them share one @ai-sdk/provider-utils.
    "@ai-sdk/mcp": ">=2.0.98 <3"
    "@ai-sdk/react": ">=4.0.175 <5"
    "@ai-sdk/workflow": ">=2.0.103 <3"
    ai: ">=7.0.171 <8"
    "@json-render/core": ">=0.22.0 <1"
    "@modelcontextprotocol/server": ">=2.4.0 <3"
    "@solidjs/start": ">=2.2.2 <3"
    "@sveltejs/kit": ">=3.2.0 <4"
    "@tanstack/react-start": ">=1.169.5 <2"
    astro: ">=7.4.11 <8"
    # The Chat SDK packages release together.
    "@chat-adapter/catalog": ">=4.44.0 <5"
    "@chat-adapter/whatsapp": ">=4.44.0 <5"
    chat: ">=4.44.0 <5"
    "@nestjs/common": ">=12.5.0 <13"
    "@next/playwright": ">=16.4.6 <17"
    # 1.10 is newer, but @supabase/lite 0.11 depends on @sentry/node 10, whose
    # @opentelemetry/core 2 caps the API below 1.10.
    "@opentelemetry/api": ">=1.9.1 <2"
    # A pre-release line (AGENTS.md "Pre-release pins"); <3 admits 2.0 stable.
    "@orpc/server": ">=2.0.0-beta.50 <3"
    "@supabase/config": "^1.6.1"
    "@supabase/lite": ">=0.11.0 <0.12"
    # A floor with no upper bound: the MCP server runs as its own process.
    "@supabase/mcp-server-supabase": ">=0.16.1"
    # The pre-release the CLI's `db diff` plans with (ADR 0108); the default
    # catalog pins the exact version the tests run.
    "@supabase/pg-delta": ">=1.0.0-alpha.60 <1.0.0"
    "@supabase/pg-topo": ">=1.0.0-alpha.8 <1.0.0"
    # A floor with no upper bound, so a newer release an app installs doesn't
    # fail strict peer checks. The default catalog stays exact (AGENTS.md
    # invariant 11), and `gen` prints a notice for any release but
    # TYPEGEN_VERSION (ADR 0016).
    "@supabase/postgrest-typegen": ">=0.8.1"
    # The newest release, which reads what postgrest-typegen 0.8 writes into
    # database.types.ts.
    "@supabase/supabase-js": "^2.119.0"
    "@tanstack/query-core": "^5.107.1"
    better-result: ">=3.0.1 <4"
    elysia: ">=1.4.32 <2"
    expo-server: ">=58.1.0 <59"
    eve: ">=0.83.3 <1"
    express: ">=5.3.0 <6"
    fastify: ">=5.12.8 <6"
    # Two majors: H3 1 is the h3/v1 entry that Nitro 2 and Nuxt 4 run
    # (@nuxt/nitro-server 4.6.4 depends on h3 ^1.15.11), H3 2 the h3 entry.
    h3: ">=1.15.11 <3"
    hono: ">=4.13.18 <5"
    jsonpath-rfc9535: ">=1.3.0 <2"
    koa: ">=3.3.0 <4"
    next: ">=16.4.6 <17"
    nuqs: ">=2.10.3 <3"
    nuxt: ">=4.6.4 <5"
    # The version @supabase/postgrest-typegen 0.8.1 peers on exactly; the CLI
    # tests run on the newer oxfmt in the default catalog.
    oxfmt: ">=0.66.0 <1"
    pg: ">=8.23.1 <9"
    react: "^19.3.1"
    react-router: ">=8.5.1 <9"
    solid-js: "^1.9.19"
    svelte: "^5.57.3"
    vue: "^3.5.45"
    redis: ">=6.3.1 <7"
    resumable-stream: ">=2.2.13 <3"
    stripe: ">=23.1.0 <24"
    temporal-polyfill: ">=1.0.8"
    valibot: ">=1.5.0 <2"
    workflow: ">=5.4.0 <6"
    yjs: ">=13.6.33 <14"
    zod: ">=4.6.7 <5"
    undici: ">=8.12.4 <9"
    fast-xml-parser: ">=5.12.0 <6"
    # The Supabase World speaks the 5.1 world protocol; world-postgres moves with it.
    "@workflow/world": ">=5.1.0 <5.2"
    "@workflow/world-postgres": ">=5.1.1 <5.2"
    # The integrations below are typed structurally or loaded on first use, so
    # better-supabase imports none of them. The peer range still tells
    # package managers which releases the conformance tests cover (ADR 0036).
    "@ai-sdk/anthropic": ">=4.0.103 <5"
    "@openfeature/server-sdk": ">=1.23.0 <2"
    "@supabase-labs/middleware-openfeature": ">=0.2.0 <0.3"
    "@powersync/common": ">=2.5.0 <3"
    "@vercel/connect": ">=2.5.0 <3"
    "@vercel/queue": ">=0.11.0 <0.12"
    # 4.0 talks to api.vercel.com over undici 8 and needs Node 22.19 or later.
    "@vercel/sandbox": ">=4.0.0 <5"
    "@ai-sdk/sandbox-vercel": ">=1.0.182 <2"
    "@vercel/schedules": ">=0.0.3 <0.1"
    botid: ">=1.5.13 <2"
    "@vercel/firewall": ">=1.2.6 <2"
    "@vercel/passport": ">=1.2.0 <2"
    "@vercel/sdk": ">=1.28.62 <2"
    "@vercel/functions": ">=3.10.1 <4"
    "@vercel/kms": ">=0.3.4 <0.4"
    "@vercel/blob": ">=2.9.0 <3"
    flags: ">=4.4.0 <5"

catalogMode: strict
nodeLinker: isolated
saveExact: true
savePrefix: ""
strictPeerDependencies: true
strictDepBuilds: true
# Transitive dependencies may only come from the registry, never git or a tarball URL.
blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
# Releases older than 30 days are trusted as they are; several of the
# transitive packages predate npm provenance.
trustPolicyIgnoreAfter: 43200
trustPolicyExcludePrune: true
# The native TypeScript 7 compiler resolves its platform binary from the root.
publicHoistPattern:
  - "@typescript/*"
nodeOptions: "${NODE_OPTIONS:- } --disable-warning=MODULE_TYPELESS_PACKAGE_JSON"

# `typescript` is deliberately not overridden: tests/types/ts-6 pins 6 through
# the ts6 catalog for the compatibility matrix.
# Fumadocs and the examples peer on wide next and react
# ranges; one version keeps every app on the same runtime.
overrides:
  next: "catalog:"
  react: "catalog:"
  react-dom: "catalog:"
  # React Native 0.86 ships a renderer built for React 19.2.3 and refuses to
  # start with another React; the Expo example stays on it.
  "@better-supabase/example-expo-powersync>react": 19.2.3
  "@better-supabase/example-expo-powersync>react-dom": 19.2.3
  # One shiki, so fumadocs-ui and the docs transformers share ShikiTransformer.
  shiki: "catalog:"
  # debug's optional peer. Without one copy, workspaces that don't declare it
  # get @babel/core with chalk's supports-color 7, and next resolves twice.
  supports-color: "catalog:"
  # marketing validates its env with valibot; without this its @t3-oss/env
  # optional zod peer picks shadcn's Zod 3 and forks the env-core variant.
  "@t3-oss/env-core>zod": "catalog:"
  # Only optional peers reach for ESLint (see packageExtensions); Oxlint runs
  # the rules, so nothing installs it.
  eslint: "-"
  # source-map-js <1.2.2 has an event-loop denial of service (high); it
  # arrives through next > postcss.
  source-map-js: ">=1.2.2"
  # zod 4 <4.6.6 can exhaust memory on oversized collections (high); it
  # arrives through the Vercel CLI and Workflow packages. Zod 3 stays.
  "zod@>=4.0.0 <4.6.6": "catalog:"
  # sharp <0.35.5 bundles a vulnerable librsvg (high); it arrives through next.
  sharp: ">=0.35.5"
  # shell-quote 1.8.4 to 1.10 has a command injection (critical); it arrives
  # through @changesets/cli and react-native.
  shell-quote: ">=1.11.0"
  # launch-editor <=2.14.1 lets a crafted path bypass its existence check on
  # Windows (high); it arrives through @changesets/cli and @nuxt/devtools.
  launch-editor: ">=2.14.2"
  # systeminformation <5.33.16 has a Windows command injection (high); it
  # arrives through shadcn > @dotenvx/dotenvx.
  systeminformation: ">=5.33.16"
  # @modelcontextprotocol/sdk <1.31.0 can send OAuth credentials to an
  # authorization server the MCP server picks (high); it arrives through shadcn.
  "shadcn>@modelcontextprotocol/sdk": ">=1.31.0"
  # uuid <11.1.1 (moderate) arrives through @expo/config-plugins > xcode, which
  # requires the CommonJS build that 11 still ships.
  "xcode>uuid": 11.1.1
  # devalue <=5.9.2 (high), nanoid 4 to 5.1.15 (high), hono <4.13.7 and
  # @hono/node-server <1.19.15 (moderate) arrive through the Workflow SDK
  # (@workflow/core, @workflow/world-testing).
  "devalue@<5.9.3": ^5.9.3
  "nanoid@>=4.0.0 <5.1.16": ^5.1.16
  "hono@<4.13.7": ^4.13.7
  "@hono/node-server@<1.19.15": ^1.19.15
  # undici 7.18 to 7.30.0 and 8 to 8.12.1 fail on a response with too many
  # content encodings (high); they arrive through the AI SDK, dotenvx, shadcn,
  # the Workflow worlds, eve, Effect and unifont.
  "undici@>=7.18.0 <7.30.1": ^7.30.1
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  # body-parser 2.0 to 2.3 reads past a compressed body (high); it arrives
  # through express and @modelcontextprotocol/sdk.
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0
  # node-forge <=1.4.0 has a PEM decoding denial of service and PKCS#12 MAC
  # forgery (high); it arrives through @expo/cli and listhen.
  node-forge: ">=1.4.2"

# eslint-plugin-turbo peers on eslint but imports nothing from it at runtime;
# Oxlint loads its rules as a JS plugin. An optional peer keeps pnpm from
# installing ESLint for it.
packageExtensions:
  eslint-plugin-turbo:
    peerDependenciesMeta:
      eslint:
        optional: true

peerDependencyRules:
  allowedVersions:
    # postgrest-typegen pins its optional oxfmt peer exactly; it formats the
    # generated types with whichever oxfmt the CLI installs.
    "@supabase/postgrest-typegen>oxfmt": "0.74.0"
    # @chat-adapter/tests peers on vitest 4; its mock adapters and state helpers
    # use only the vi.fn() API that vitest 5 keeps.
    "@chat-adapter/tests>vitest": "5.1.0"
    # workflow 5.4 depends on @workflow/nest, which brings NestJS 12;
    # @supabase/server lists NestJS 10 or 11 as an optional peer it never
    # loads on our paths.
    "@supabase/server>@nestjs/common": "12.5.0"
    # The World conformance suite peers on Vitest 4; it runs on the repo's
    # Vitest 5 through the same describe and test API.
    "@workflow/world-testing>vitest": "5.1.0"
    # @workflow/swc-plugin pins @swc/core 1.15.3; the Next.js example gets
    # 1.16.13 through @workflow/nest's @swc/cli, which it never runs, and Next
    # compiles with its own SWC.
    "@workflow/swc-plugin>@swc/core": "1.16.13"
    # @supabase/lite depends on jsonv-ts, which peers on TypeScript 5 for its
    # type helpers; the runtime validators liteStack() and gen load use none.
    "jsonv-ts>typescript": "7.0.2"
    # SvelteKit peers on TypeScript 6 for its generated types; the library
    # only reads its declarations in the framework conformance test.
    "@sveltejs/kit>typescript": "7.0.2"
    # apps/docs gets Nuxt only as an optional peer of @vercel/analytics and
    # @vercel/speed-insights, which it never loads; pnpm links that copy to the
    # rolldown 1.3.0 the docs graph has. The library's Nuxt runs rolldown 1.2.
    "nuxt>rolldown": "1.3.0"
    # The Expo example overrides React to 19.2.3 (see overrides); the global
    # React override rewrites every React peer range to the catalog version.
    react: 19.2.3
    react-dom: 19.2.3

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 has no patched release. It reaches the tree only through
    # shadcn in apps/marketing (dev tooling, never shipped). Remove it once a
    # fixed braces ships or shadcn drops micromatch (ADR 0002).
    - GHSA-vfj7-8cjw-p6xm
    # zod <4.6.6 has no patched 3.x release. The override above lifts every
    # zod 4; zod 3 stays only for @expo/cli in apps/examples/expo-powersync
    # (dev tooling, never shipped). Remove it once @expo/cli moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5
    # decode-uri-component <=0.4.2 (moderate) and <=0.5.0 (high) reach the tree
    # only through expo-router > query-string 7 in apps/examples/expo-powersync
    # and the registry's expo devDependency. The fixes, 0.5 and 0.5.1, are
    # ESM-only and query-string 7 requires it as a function. Remove both once
    # expo-router moves to query-string 8 or later (ADR 0002).
    - GHSA-vcc3-ghjq-m6fr
    # The same path carries GHSA-qr28-fpjm-wq7f (high, <=0.5.0); 0.5.1 is
    # ESM-only too. Remove it with GHSA-vcc3-ghjq-m6fr (ADR 0002).
    - GHSA-qr28-fpjm-wq7f
    # nodemailer <=10.0.5 reaches the tree only through @supabase/lite 0.11,
    # which requires nodemailer 9; the liteStack() tests send no mail. Remove
    # them once @supabase/lite moves to nodemailer 10.0.6 or later (ADR 0002).
    - GHSA-v53p-9fqp-m79j
    - GHSA-prgh-xp8r-p3m5

allowBuilds:
  # tsdown and vite bundle through esbuild's platform binary.
  esbuild: true
  # next-intl's message extractor (Next.js example). Both load the prebuilt
  # binary from their optional platform packages; the scripts only build
  # from source as a fallback.
  "@parcel/watcher": false
  "@swc/core": false
  # cbor-x (through @workflow/world-postgres) falls back to its JavaScript
  # decoder without the native extension.
  cbor-extract: false
  # pg-topo (through pg-delta) parses SQL with it; the script only builds the
  # native fallback.
  "@launchql/protobufjs": false
  # Installs the git hooks from lefthook.yml.
  lefthook: true
  # next/image in docs and marketing needs the sharp native binary.
  sharp: true
  # Downloads the Supabase CLI binary for the supabase:* scripts.
  supabase: true
