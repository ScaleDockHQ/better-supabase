  fumadocs-ui: npm:@fumadocs/base-ui@16.15.15
  hono: 4.13.10
  knip: 6.38.0
  lefthook: 2.1.14
  lucide-react: 1.48.0
  next: 16.3.7
  next-themes: 0.4.6
  oxfmt: 0.71.0
  "@oxlint/plugins": 1.86.0
  "@shadcn/lint": 0.2.0
  eslint-plugin-playwright: 2.12.0
  eslint-plugin-turbo: 2.11.5
  oxlint-plugin-react-doctor: 0.9.14
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  pg: 8.23.0
  portless: 0.15.6
  postcss: 8.5.28
  publint: 0.3.24
  react: 19.3.0
  react-dom: 19.3.0
  server-only: 0.0.1
  shadcn: 4.21.0
  shiki: 4.4.3
  smol-toml: 1.9.0
  # Keep on the SUPABASE_CLI_VERSION that CI installs.
  supabase: 2.118.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tinyexec: 1.3.1
  tsdown: 0.23.0
  turbo: 2.11.5
