catalogs:
  ts6:
    typescript: 6.0.3
  # The first release with content mappers, type-checked in tests/types/ts-7.1
  # and apps/examples/content-mapper while the toolchain stays on 7.0
  # (docs/decisions/0097).
  ts71:
    typescript: 7.1.0-beta
  # The previous major of each framework adapter whose peer range still
  # covers it, type-checked in tests/types/frameworks-previous. SvelteKit
  # declares its types as an ambient module, so two majors cannot share one
  # program under npm aliases.
  previous-majors:
    "@nuxt/nitro-server": 3.21.11
    "@sveltejs/kit": 2.70.3
    h3: 1.15.11
    nuxt: 3.21.11
    react-router: 7.18.4
  # Ranges for the published packages' runtime dependencies, so an app's
  # supabase-js and better-supabase share one copy of each.
  deps:
    "@standard-schema/spec": "^1.1.0"
    "@supabase/middleware": "^1.0.0"
    # The floor of the @supabase/supabase-js peer, which pins postgrest-js exactly.
    "@supabase/postgrest-js": "^2.118.0"
    "@supabase/server": "^1.9.1"
    "@supabase/ssr": "^0.12.7"
  # Ranges the published packages declare as peers, so consumers pick the
  # version. They are deliberately not exact pins.
  peers:
    # 4.0 is the useChat that ships with ai 7.
    # 2.0 is the MCP client that ships with ai 7.
    "@ai-sdk/mcp": ">=2 <3"
    "@ai-sdk/react": ">=4 <5"
    # 2.0 is the WorkflowAgent for ai 7; it pins ai exactly, so the AI set moves together.
    "@ai-sdk/workflow": ">=2 <3"
    # 2.3.0 is the first release with createMcpHandler and the web-standard bearer helpers.
    "@modelcontextprotocol/server": ">=2.3.0 <3"
    "@solidjs/start": ">=2 <3"
    # SvelteKit 2 stays in range while apps move to 3 (released 2026-10-01);
    # tests/types/frameworks-previous checks it.
    "@sveltejs/kit": ">=2 <4"
    "@tanstack/react-start": ">=1 <2"
    astro: ">=7 <8"
    # 4.41.0 is the first Chat SDK with the StateAdapter queue and list methods better-supabase/chat-sdk implements.
    chat: ">=4.41 <5"
    # 11 is the oldest major that runs on Node 24; @Ctx() requires it synchronously.
    "@nestjs/common": ">=11 <13"
    # 16.2.0 ships instant() with the baseURL option; expectInstant loads it on demand.
    "@next/playwright": ">=16.2 <17"
    "@opentelemetry/api": ">=1.9 <2"
    "@orpc/server": ">=2.0.0-beta.40 <3"
    "@supabase/config": ">=0.9.0 <0.12"
    # 0.11.0 is the first release with App.getClient() and the PGlite migrator liteStack() and gen use.
    "@supabase/lite": ">=0.11.0 <0.12"
    "@supabase/mcp-server-supabase": ">=0.13.0 <0.15"
    # A range, so a newer patch an app installs doesn't fail strict peer
    # checks. The default catalog stays exact (AGENTS.md invariant 11), and
    # `gen` prints a notice for any release but TYPEGEN_VERSION (ADR 0016).
    "@supabase/postgrest-typegen": ">=0.6.0 <0.7"
    # 2.118.0 reads the ComputedFields key and the no-argument function
    # overloads that postgrest-typegen 0.6 writes into database.types.ts.
    "@supabase/supabase-js": "^2.118.0"
    # 5.62.0 added the error parameter of DataTag (dataTagErrorSymbol) the query keys use.
    "@tanstack/query-core": "^5.62.0"
    # 7.0 is the UI message stream protocol and the approval parts the AI SDK adapters convert.
    ai: ">=7 <8"
    # 3.0 is the TaggedError and Result API withBetterResult types its views with.
    better-result: ">=3 <4"
    elysia: ">=1 <2"
    # 55.0.0 added setResponseHeaders, which the Expo adapter writes cookies through.
    expo-server: ">=55 <59"
    # 0.71 is the memory provider, hook and connection contract better-supabase/eve is typed against.
    eve: ">=0.71 <1"
    express: ">=5 <6"
    fastify: ">=5 <6"
    # H3 1 is the h3/v1 entry Nitro 2 and Nuxt run; H3 2 is the h3 entry.
    h3: ">=1 <3"
    hono: ">=4 <5"
    # 1.3.0 passes the full JSONPath Compliance Test Suite (RFC 9535) that the overlays in better-supabase/spec require.
    jsonpath-rfc9535: ">=1.3.0 <2"
    koa: ">=3 <4"
    # 16.3.0 added `io()`, which `better-supabase/next` awaits before reading the session.
    next: ">=16.3 <17"
    # 2.3.0 added createLoader, which the nuqs() generator writes.
    nuqs: ">=2.3 <3"
    # Nuxt 3 is checked in tests/types/frameworks-previous.
    nuxt: ">=3 <5"
    # 0.66.0 is the version @supabase/postgrest-typegen pins; the CLI tests run
    # on the newer oxfmt in the default catalog.
    oxfmt: ">=0.66.0 <1"
    pg: ">=8.15 <9"
    react: "^19"
    # 7.9 stabilized the middleware the adapter mounts; 7 is checked in
    # tests/types/frameworks-previous.
    react-router: ">=7.9 <9"
    solid-js: "^1.8"
    # 5.7.0 added createSubscriber, which the Svelte bindings read through.
    svelte: "^5.7"
    # 3.3 added the generic `toValue` and `MaybeRefOrGetter` the Vue composables accept.
    vue: "^3.3"
    # 5.0.0 is the first node-redis with the camelCase commands the Redis stream store sends.
    redis: ">=5 <7"
    # 17 is the first release with createFetchHttpClient and billing.meterEvents.
    stripe: ">=17 <24"
    temporal-polyfill: ">=1"
    # 5.1.0 adds the dynamic workflows the builder compiles to.
    workflow: ">=5.1 <6"
    # 13.6 has the mergeUpdates and diffUpdate the document compaction uses.
    yjs: ">=13.6 <14"
    # The Supabase World speaks the 5.0 world protocol; world-postgres moves with it.
    "@workflow/world": ">=5.0.2 <5.1"
    "@workflow/world-postgres": ">=5.0.2 <5.1"
    # The integrations below are typed structurally or loaded on first use, so
    # better-supabase imports none of them. The peer range still tells
    # package managers which majors the conformance tests cover (ADR 0036).
    # 4.0 is the provider for ai 7; anthropicMemory calls its memory tool.
    "@ai-sdk/anthropic": ">=4 <5"
    # 1.x is the server Provider contract createFlagsProvider implements.
    "@openfeature/server-sdk": ">=1 <2"
    # A 0.x Supabase Labs package: 0.2.0 is the FlagClient createFlagClient matches.
    "@supabase-labs/middleware-openfeature": ">=0.2.0 <0.3"
    # connect, disconnect and disconnectAndClear, which syncWithAuth drives, exist in both majors.
    "@powersync/common": ">=1 <3"
    # 2.x has getTokenResponse, revokeToken and startAuthorization.
    "@vercel/connect": ">=2 <3"
    # 0.8 has PollingQueueClient with send and receive; the 0.x line may still change.
    "@vercel/queue": ">=0.8 <0.9"
    # 4.1.0 added bulkDecide and adapterId; 4.2.0 resolves an adapter factory passed by reference.
    flags: ">=4.2 <5"

catalogMode: strict
nodeLinker: isolated
saveExact: true
savePrefix: ""
strictPeerDependencies: true
strictDepBuilds: true
# Transitive dependencies may only come from the registry, never git or a tarball URL.
blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
# Releases older than 30 days are trusted as they are; several of the
# transitive packages predate npm provenance.
trustPolicyIgnoreAfter: 43200
trustPolicyExcludePrune: true
# The native TypeScript 7 compiler resolves its platform binary from the root.
publicHoistPattern:
  - "@typescript/*"
nodeOptions: "${NODE_OPTIONS:- } --disable-warning=MODULE_TYPELESS_PACKAGE_JSON"

# `typescript` is deliberately not overridden: tests/types/ts-6 pins 6 through
# the ts6 catalog for the compatibility matrix.
# Fumadocs and the examples peer on wide next and react
# ranges; one version keeps every app on the same runtime.
overrides:
  next: "catalog:"
  react: "catalog:"
  react-dom: "catalog:"
  # React Native 0.86 ships a renderer built for React 19.2.3 and refuses to
  # start with another React; the Expo example stays on it.
  "@better-supabase/example-expo-powersync>react": 19.2.3
  "@better-supabase/example-expo-powersync>react-dom": 19.2.3
  # One shiki, so fumadocs-ui and the docs transformers share ShikiTransformer.
  shiki: "catalog:"
  # debug's optional peer. Without one copy, workspaces that don't declare it
  # get @babel/core with chalk's supports-color 7, and next resolves twice.
  supports-color: "catalog:"
  # marketing validates its env with valibot; without this its @t3-oss/env
  # optional zod peer picks shadcn's Zod 3 and forks the env-core variant.
  "@t3-oss/env-core>zod": "catalog:"
  # Only optional peers reach for ESLint (see packageExtensions); Oxlint runs
  # the rules, so nothing installs it.
  eslint: "-"
  # source-map-js <1.2.2 has an event-loop denial of service (high); it
  # arrives through next > postcss.
  source-map-js: ">=1.2.2"
  # zod 4 <4.6.6 can exhaust memory on oversized collections (high); it
  # arrives through the Vercel CLI and Workflow packages. Zod 3 stays.
  "zod@>=4.0.0 <4.6.6": "catalog:"
  # sharp <0.35.5 bundles a vulnerable librsvg (high); it arrives through next.
  sharp: ">=0.35.5"
  # shell-quote 1.8.4 to 1.10 has a command injection (critical); it arrives
  # through @changesets/cli and react-native.
  shell-quote: ">=1.11.0"
  # launch-editor <=2.14.1 lets a crafted path bypass its existence check on
  # Windows (high); it arrives through @changesets/cli and @nuxt/devtools.
  launch-editor: ">=2.14.2"
  # @modelcontextprotocol/sdk <1.31.0 can send OAuth credentials to an
  # authorization server the MCP server picks (high); it arrives through shadcn.
  "shadcn>@modelcontextprotocol/sdk": ">=1.31.0"
  # uuid <11.1.1 (moderate) arrives through @expo/config-plugins > xcode, which
  # requires the CommonJS build that 11 still ships.
  "xcode>uuid": 11.1.1
  # devalue <=5.9.2 (high), nanoid 4 to 5.1.15 (high), hono <4.13.7 and
  # @hono/node-server <1.19.15 (moderate) arrive through the Workflow SDK
  # (@workflow/core, @workflow/world-testing).
  "devalue@<5.9.3": ^5.9.3
  "nanoid@>=4.0.0 <5.1.16": ^5.1.16
  "hono@<4.13.7": ^4.13.7
  "@hono/node-server@<1.19.15": ^1.19.15
  # undici 7.18 to 7.30.0 and 8 to 8.12.1 fail on a response with too many
  # content encodings (high); they arrive through the AI SDK, dotenvx, shadcn,
  # the Workflow worlds, eve, Effect and unifont.
  "undici@>=7.18.0 <7.30.1": ^7.30.1
  "undici@>=8.0.0 <8.12.2": ^8.12.2
  # body-parser 2.0 to 2.3 reads past a compressed body (high); it arrives
  # through express and @modelcontextprotocol/sdk.
  "body-parser@>=2.0.0 <2.4.0": ^2.4.0

# eslint-plugin-playwright and eslint-plugin-turbo peer on eslint but import
# nothing from it at runtime; Oxlint loads their rules as JS plugins. An
# optional peer keeps pnpm from installing ESLint for them.
packageExtensions:
  eslint-plugin-playwright:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-turbo:
    peerDependenciesMeta:
      eslint:
        optional: true

peerDependencyRules:
  allowedVersions:
    # postgrest-typegen pins its optional oxfmt peer exactly; it formats the
    # generated types with whichever oxfmt the CLI installs.
    "@supabase/postgrest-typegen>oxfmt": "0.74.0"
    # @chat-adapter/tests peers on vitest 4; its mock adapters and state helpers
    # use only the vi.fn() API that vitest 5 keeps.
    "@chat-adapter/tests>vitest": "5.0.5"
    # Expo SDK 57's @expo/ui depends on worklets 0.13 while expo-modules-core
    # still lists an optional peer range that ends at 0.10.
    "expo-modules-core>react-native-worklets": "0.13.0"
    # workflow 5.1 depends on @workflow/nest, which brings NestJS 12;
    # @supabase/server lists NestJS 10 or 11 as an optional peer it never
    # loads on our paths.
    "@supabase/server>@nestjs/common": "12.1.3"
    # The World conformance suite peers on Vitest 4; it runs on the repo's
    # Vitest 5 through the same describe and test API.
    "@workflow/world-testing>vitest": "5.0.5"
    # @workflow/swc-plugin pins @swc/core 1.15.3; the Next.js example gets
    # 1.16.13 through @workflow/nest's @swc/cli, which it never runs, and Next
    # compiles with its own SWC.
    "@workflow/swc-plugin>@swc/core": "1.16.13"
    # @supabase/lite depends on jsonv-ts, which peers on TypeScript 5 for its
    # type helpers; the runtime validators liteStack() and gen load use none.
    "jsonv-ts>typescript": "7.0.2"
    # SvelteKit peers on TypeScript 6 for its generated types; the library
    # only reads its declarations in the framework conformance test.
    "@sveltejs/kit>typescript": "7.0.2"
    # Nuxt 3 depends on @nuxt/cli 3, whose @nuxt/schema peer moved to Nuxt 4;
    # tests/types/frameworks-previous only reads Nuxt 3's types.
    "@nuxt/cli>@nuxt/schema": "3.21.11"
    # The Expo example overrides React to 19.2.3 (see overrides); the global
    # React override rewrites every React peer range to the catalog version.
    react: 19.2.3
    react-dom: 19.2.3

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 has no patched release. It reaches the tree only through
    # shadcn in apps/marketing (dev tooling, never shipped). Remove it once a
    # fixed braces ships or shadcn drops micromatch (ADR 0002).
    - GHSA-vfj7-8cjw-p6xm
    # node-forge <=1.4.0 has no patched release. It reaches the tree only
    # through @expo/cli in apps/examples/expo-powersync (dev tooling, never
    # shipped). Remove it once a fixed node-forge ships (ADR 0002).
    - GHSA-86w9-cpqp-85rv
    # zod <4.6.6 has no patched 3.x release. The override above lifts every
    # zod 4; zod 3 stays only for @expo/cli in apps/examples/expo-powersync
    # (dev tooling, never shipped). Remove it once @expo/cli moves to zod 4.
    - GHSA-mrhx-c7xc-m3w5
    # decode-uri-component <=0.4.2 (moderate) reaches the tree only through
    # expo-router > query-string 7 in apps/examples/expo-powersync. The fix,
    # 0.5, is ESM-only and query-string 7 requires it as a function. Remove it
    # once expo-router moves to query-string 8 or later (ADR 0002).
    - GHSA-vcc3-ghjq-m6fr
    # nodemailer <=10.0.5 reaches the tree only through @supabase/lite 0.11,
    # which requires nodemailer 9; the liteStack() tests send no mail. Remove
    # them once @supabase/lite moves to nodemailer 10.0.6 or later (ADR 0002).
    - GHSA-v53p-9fqp-m79j
    - GHSA-prgh-xp8r-p3m5

allowBuilds:
  # tsdown and vite bundle through esbuild's platform binary.
  esbuild: true
  # next-intl's message extractor (Next.js example). Both load the prebuilt
  # binary from their optional platform packages; the scripts only build
  # from source as a fallback.
  "@parcel/watcher": false
  "@swc/core": false
  # cbor-x (through @workflow/world-postgres) falls back to its JavaScript
  # decoder without the native extension.
  cbor-extract: false
  # Installs the git hooks from lefthook.yml.
  lefthook: true
