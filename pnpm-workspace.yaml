  valibot: 1.5.0
  vite: 8.3.1
  vitest: 5.0.2
  # Only the core package's zod generator fixture imports Zod, and `ai` needs it
  # as a peer (docs/decisions/0002). Lint rejects `zod` imports everywhere else.
  zod: 4.6.5

catalogs:
  ts59:
    typescript: 5.9.3
  ts6:
    typescript: 6.0.3
  # Ranges the published packages declare as peers, so consumers pick the
  # version. They are deliberately not exact pins.
  peers:
    "@opentelemetry/api": ">=1.9"
    "@orpc/server": ">=2.0.0-0"
    "@supabase/config": ">=0.9.0 <0.11"
    "@supabase/supabase-js": "^2.116.0"
    "@tanstack/query-core": "^5"
    hono: ">=4"
    next: ">=16"
    pg: ">=8"
    react: "^19"

catalogMode: strict
nodeLinker: isolated
saveExact: true
savePrefix: ""
strictPeerDependencies: true
strictDepBuilds: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
# Releases older than 30 days are trusted as they are; several of the
# transitive packages predate npm provenance.
trustPolicyIgnoreAfter: 43200
trustPolicyExcludePrune: true
# The native TypeScript 7 compiler resolves its platform binary from the root.
publicHoistPattern:
  - "@typescript/*"
nodeOptions: "${NODE_OPTIONS:- } --disable-warning=MODULE_TYPELESS_PACKAGE_JSON"

# `typescript` is deliberately not overridden: tests/types/* and apps/docs pin
# 5.9 and 6 through the ts59 and ts6 catalogs for the compatibility matrix.
# Fumadocs, @next/playwright and the examples peer on wide next and react
# ranges; one version keeps every app on the same runtime.
overrides:
  next: "catalog:"
  react: "catalog:"
  react-dom: "catalog:"

allowBuilds:
  # tsdown and vite bundle through esbuild's platform binary.
  esbuild: true
  # Installs the git hooks from lefthook.yml.
  lefthook: true
  # next/image in docs and marketing needs the sharp native binary.
  sharp: true
  # Downloads the Supabase CLI binary for the supabase:* scripts.
  supabase: true
