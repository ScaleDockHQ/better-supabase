  '@base-ui/react': 1.8.0
  '@changesets/cli': 3.0.3
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@commitlint/types': 21.2.3
  '@effect/platform-node': 4.0.0-rc.117
  '@next/playwright': 16.3.6
  '@opentelemetry/api': 1.9.1
  '@orpc/server': 2.0.0-beta.40
  '@playwright/test': 1.63.0
  '@standard-schema/spec': 1.1.0
  '@supabase/config': 0.10.0
  '@supabase/middleware': 0.6.0
  '@supabase/postgrest-typegen': 0.2.2
  '@supabase/server': 1.8.1
  '@supabase/ssr': 0.12.7
  '@supabase/supabase-js': 2.117.2
  '@tailwindcss/postcss': 4.3.3
  '@tanstack/query-core': 5.104.0
  '@tanstack/react-query': 5.104.0
  '@types/mdx': 2.0.14
  '@types/node': 24.19.0
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/coverage-v8': 5.0.2
  better-result: 3.0.1
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dotenv-cli: 11.0.0
  effect: 4.0.0-rc.117
  fumadocs-core: 16.15.15
  fumadocs-mdx: 15.4.5
  fumadocs-twoslash: 4.0.1
  # Base UI build of fumadocs-ui, kept on the fumadocs-core version.
  fumadocs-ui: npm:@fumadocs/base-ui@16.15.15
  hono: 4.13.10
  jose: 6.2.12
  lefthook: 2.1.14
  lucide-react: 1.48.0
  next: 16.3.7
  next-themes: 0.4.6
  nuqs: 2.10.1
  oxfmt: 0.71.0
  '@oxlint/plugins': 1.86.0
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  pg: 8.23.0
  portless: 0.15.6
  postcss: 8.5.28
  publint: 0.3.24
  react: 19.3.0
  react-dom: 19.3.0
  server-only: 0.0.1
  shadcn: 4.21.0
  shiki: 4.4.3
  # Keep on the SUPABASE_CLI_VERSION that CI installs.
  supabase: 2.118.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tsdown: 0.23.0
  turbo: 2.11.5
  tw-animate-css: 1.4.0
  twoslash: 0.3.9
  typescript: 7.0.2
  valibot: 1.5.0
  vite: 8.3.1
  vitest: 5.0.2
  zod: 4.6.5

catalogs:
  ts59:
    typescript: 5.9.3
  ts6:
    typescript: 6.0.3
  peers:
    '@opentelemetry/api': '>=1.9'
    '@orpc/server': '>=2.0.0-0'
    '@supabase/config': '>=0.9.0 <0.11'
    '@supabase/supabase-js': '^2.116.0'
    '@tanstack/query-core': '^5'
    hono: '>=4'
    next: '>=16'
    pg: '>=8'
    react: '^19'

catalogMode: strict
nodeLinker: isolated
saveExact: true
savePrefix: ''
strictPeerDependencies: true
strictDepBuilds: true
engineStrict: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
# The native TypeScript 7 compiler resolves its platform binary from the root.
publicHoistPattern:
  - '@typescript/*'
nodeOptions: '${NODE_OPTIONS:- } --disable-warning=MODULE_TYPELESS_PACKAGE_JSON'

# `typescript` is deliberately not overridden: tests/types/* and apps/docs pin
# 5.9 and 6 through the ts59 and ts6 catalogs for the compatibility matrix.
overrides:
  next: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'

allowBuilds:
  # tsdown and vite bundle through esbuild's platform binary.
  esbuild: true
  # Installs the git hooks from lefthook.yml.
  lefthook: true
  # next/image in docs and marketing needs the sharp native binary.
  sharp: true
  # Downloads the Supabase CLI binary for the supabase:* scripts.
  supabase: true
