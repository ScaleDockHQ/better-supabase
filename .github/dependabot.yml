version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # The working branch; switch to develop once it exists.
    target-branch: main
    schedule:
      interval: weekly
    # pnpm refuses releases younger than minimumReleaseAge (1440 minutes).
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    ignore:
      # Pinned to an exact version so database.types.ts matches
      # `supabase gen types`; bumping needs the parity test (AGENTS.md).
      - dependency-name: "@supabase/postgrest-typegen"
      # The compatibility matrix pins these on purpose.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
