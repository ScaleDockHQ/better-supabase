version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm refuses releases younger than minimumReleaseAge (1440 minutes).
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    ignore:
      # Pinned to an exact version so database.types.ts matches
      # `supabase gen types`; bumping needs the parity test (AGENTS.md).
      - dependency-name: '@supabase/postgrest-typegen'
      # The compatibility matrix pins these on purpose.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      oxc:
        patterns:
          - oxlint
          - oxfmt
          - oxlint-tsgolint
          - '@oxlint/*'
      turbo:
        patterns:
          - turbo
          - '@turbo/*'
      supabase:
        patterns:
          - '@supabase/*'
      commitlint:
        patterns:
          - '@commitlint/*'
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns:
          - '*'
