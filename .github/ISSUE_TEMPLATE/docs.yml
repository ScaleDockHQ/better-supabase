name: Docs
description: Report a docs error or gap
title: "docs: "
labels: ["docs"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: A /docs URL, or a path under apps/docs/content/docs.
      placeholder: https://bettersupabase.com/docs/repository/filtering
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Optional. A patch or the wording you expected.
