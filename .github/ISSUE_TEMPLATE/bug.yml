name: Bug
description: Report a defect in better-supabase
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Security reports go to SECURITY.md, not here.
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Include the `DbError` (kind, code, message) if there is one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps, a code sample, and the SQL for the tables involved.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: better-supabase
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: supabase
    attributes:
      label: "@supabase/supabase-js and Supabase CLI"
      placeholder: "2.117.2, CLI 2.118.0"
    validations:
      required: true
  - type: input
    id: typescript
    attributes:
      label: TypeScript and Node.js
      placeholder: "7.0.2, Node 24.20.0"
    validations:
      required: true
  - type: input
    id: entry
    attributes:
      label: Import path
      description: For example better-supabase/next or better-supabase/hono. Leave blank for the core.
      placeholder: better-supabase/next
