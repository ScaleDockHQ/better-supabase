name: Setup
description: Vercel Remote Cache through OIDC, then pnpm with the Node major from .node-version and the store cache.

inputs:
  cache:
    description: Restore the pnpm store and connect the Turborepo Remote Cache.
    default: "true"
  save-cache:
    description: >-
      Save the pnpm store after the job. Only verify's `static` job sets it, on the default branch:
      pull requests restore that entry instead of uploading near-identical stores against the
      10 GB repository limit, and the other jobs don't archive a store that one key already holds.
    default: "false"
  install:
    description: Run `pnpm install`. Jobs that need only the pnpm binary set this to false.
    default: "true"
  turbo-team:
    description: Vercel team that owns the Remote Cache.
    default: scaledock

runs:
  using: composite
  steps:
    # Needs `id-token: write` and a Turborepo CLI OIDC policy for this repository on the team.
    # Builds still run without the cache, so a failed exchange only logs an error.
    - if: inputs.cache == 'true'
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      continue-on-error: true
      with:
        team: ${{ inputs.turbo-team }}

    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: node
        node-version-file: .node-version
        cache: ${{ inputs.cache == 'true' }}
        save-cache: ${{ inputs.save-cache == 'true' }}
        install: ${{ inputs.install == 'true' }}
        require-lockfile: true
