name: Setup
description: Vercel Remote Cache through OIDC, then pnpm with the Node major from .node-version and the store cache.

inputs:
  cache:
    description: Restore the pnpm store and connect the Turborepo Remote Cache.
    default: "true"
  turbo-team:
    description: Vercel team that owns the Remote Cache.
    default: scaledock

runs:
  using: composite
  steps:
    # Needs `id-token: write`; builds still run without the cache.
    - if: inputs.cache == 'true'
      uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
      continue-on-error: true
      with:
        team: ${{ inputs.turbo-team }}

    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        runtime: node
        node-version-file: .node-version
        cache: ${{ inputs.cache == 'true' }}
        require-lockfile: true
