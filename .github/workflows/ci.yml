name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # release.yml runs the same gate on every push to main.
  verify:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: $/.github/workflows/verify.yml
    with:
      affected: true
      base: ${{ github.event.pull_request.base.sha }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  # Vercel production builds the docs on push. A pull request builds them here only when the
  # docs package changed, because a failing preview does not block a merge.
  docs:
    name: Docs build
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Build the docs
        run: /usr/bin/time -v -o build-usage.txt pnpm exec turbo run build --filter=docs

      - name: Log the build's memory and time
        if: always() && hashFiles('build-usage.txt') != ''
        run: |
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" build-usage.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Vite's example builds here. The Next.js example builds in `verify / next build`, which measures
  # its output, so a second build would miss the Turbo cache for both.
  adapter-builds:
    name: Adapter build (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.vite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vite and React
            filter: "@better-supabase/example-vite-react"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Build the example
        env:
          FILTER: ${{ matrix.filter }}
        run: pnpm exec turbo run build --filter="$FILTER"

  # A change that touches neither the library, the suites that run on the stack, nor the stack
  # itself skips Integration. The job reads file paths with Node only, so it needs no install.
  # Pull requests diff the merge commit against its first parent, pushes diff against the
  # previous tip.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stack: ${{ steps.paths.outputs.stack }}
      docs: ${{ steps.paths.outputs.docs }}
      vite: ${{ steps.paths.outputs.vite }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: $/.github/actions/setup
        with:
          cache: "false"
          install: "false"

      - id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base=$(git rev-parse HEAD^1)
          else
            base="$BEFORE"
            # A push that rewrote history has a base the shallow clone lacks. Without it the
            # script marks everything.
            git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          fi
          node scripts/ci-changes.ts "$base" | tee -a "$GITHUB_OUTPUT"

  # Runs next to verify, not after it: Integration is the longest job, so waiting for verify would
  # add its whole runtime to the critical path. Each shard starts its own stack.
  stack:
    name: Integration (${{ matrix.name }})
    needs: changes
    # A skipped or failed changes job must not start the stack.
    if: ${{ !cancelled() && needs.changes.outputs.stack == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Vitest shards by file count, not duration. The pg-delta round trip takes about two
      # minutes on its own (the other files take seconds), so it gets its own job.
      matrix:
        include:
          - name: 1/3
            args: --shard=1/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: 2/3
            args: --shard=2/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: 3/3
            args: --shard=3/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: pg-delta round trip
            args: tests/integration/pgdelta-roundtrip.integration.test.ts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # config.toml points signing_keys_path at this gitignored file, so the stack signs and
      # verifies ES256 tokens like a hosted project. The stack needs it before it starts, and it
      # starts in about 15 seconds, so starting it as a background step would save nothing.
      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      - name: Integration
        env:
          ARGS: ${{ matrix.args }}
        run: |
          read -ra args <<< "$ARGS"
          pnpm exec dotenv -e .env.development.local -- \
            pnpm --filter better-supabase exec vitest run --project integration "${args[@]}"

  # Its own jobs, so they run next to the shards instead of after one of them. CentraKit takes
  # about as long as the other three suites together.
  validation:
    name: Integration (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.stack == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CentraKit
            filters: --filter @better-supabase/validation-centrakit
          - name: validation projects
            filters: >-
              --filter @better-supabase/validation-recipes
              --filter @better-supabase/validation-presets
              --filter @better-supabase/validation-request-context
          # eve's own server on the Supabase World, in every delivery mode the stack supports.
          - name: eve on the World
            filters: --filter @better-supabase/eve-world
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      # --workspace-concurrency=1: the suites share the stack's database.
      - name: Validation projects on the stack
        env:
          FILTERS: ${{ matrix.filters }}
        run: |
          read -ra filters <<< "$FILTERS"
          pnpm exec dotenv -e .env.development.local -- \
            pnpm --workspace-concurrency=1 "${filters[@]}" test
