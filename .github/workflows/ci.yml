name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  SUPABASE_CLI_VERSION: 2.119.0
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Lint the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

  verify:
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/verify.yml
    with:
      affected: ${{ github.event_name == 'pull_request' }}
      base: ${{ github.event.pull_request.base.sha || '' }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  stack:
    name: Integration and e2e
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    steps:
      # Runs before checkout: the action runs npm in the workspace, and npm
      # rejects the root package.json, whose devEngines require pnpm.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # config.toml points signing_keys_path at this gitignored file, so the
      # stack signs and verifies ES256 tokens like a hosted project.
      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=@better-supabase/cli...
          pnpm exec better-supabase keys --cwd .

      - name: Start Supabase
        run: |
          supabase start
          supabase status --env --output-format text --agent no \
            --override-name API_URL=SUPABASE_URL \
            --override-name PUBLISHABLE_KEY=SUPABASE_PUBLISHABLE_KEY \
            --override-name SECRET_KEY=SUPABASE_SECRET_KEY \
            --override-name DB_URL=SUPABASE_DB_URL \
            | sed -E "s/^([A-Z0-9_]+)='(.*)'$/\1=\2/" >> "$GITHUB_ENV"

      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            apps/*/.next/cache
            apps/examples/*/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/*.mdx', '!apps/**/node_modules/**', '!apps/**/.next/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      # Next builds run one at a time on GitHub-hosted runners.
      - name: Build
        run: pnpm exec turbo run build --concurrency=1 --log-file

      - name: Integration
        run: pnpm run test:integration

      - name: Install Chromium (instant navigation tests)
        run: pnpm --filter @better-supabase/e2e exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm run test:e2e

      - name: Validation (request context on the stack)
        run: pnpm --filter @better-supabase/validation-request-context test
