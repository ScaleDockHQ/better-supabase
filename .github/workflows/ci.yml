name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  SUPABASE_CLI_VERSION: 2.119.0
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  verify:
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/verify.yml
    with:
      affected: ${{ github.event_name == 'pull_request' }}
      base: ${{ github.event.pull_request.base.sha || '' }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  stack:
    name: Integration and e2e
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    steps:
      # Runs before checkout: the action runs npm in the workspace, and npm
      # rejects the root package.json, whose devEngines require pnpm.
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # config.toml points signing_keys_path at this gitignored file, so the
      # stack signs and verifies ES256 tokens like a hosted project.
      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=@better-supabase/cli...
          pnpm exec better-supabase keys --cwd .

      - name: Start Supabase
        run: |
          supabase start
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.publishable_key=SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SECRET_KEY \
            --override-name auth.jwt_secret=SUPABASE_JWT_SECRET \
            --override-name db.url=SUPABASE_DB_URL \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      # Next builds run one at a time on GitHub-hosted runners.
      - name: Build
        run: pnpm exec turbo run build --concurrency=1 --log-file

      - name: Integration
        run: pnpm run test:integration

      - name: Install Chromium (instant navigation tests)
        run: pnpm --filter @better-supabase/e2e exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm run test:e2e

      - name: Validation (request context on the stack)
        run: pnpm --filter @better-supabase/validation-request-context test
