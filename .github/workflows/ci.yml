name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Typecheck matrix (TypeScript 5.9, 6, 7)
        run: pnpm run typecheck:matrix

      - name: Type performance
        run: pnpm run typecheck:perf

      - name: Test
        run: pnpm run test

      - name: Size
        run: pnpm run size

      - name: Generated code drift
        run: |
          for project in apps/examples/* tests/validation-*; do
            pnpm exec better-supabase gen --check --cwd "$project"
          done

      - name: Doctor (SARIF)
        run: pnpm exec better-supabase doctor --cwd apps/examples/nextjs --format sarif --out doctor.sarif

      - name: Upload doctor findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: doctor.sarif
          category: better-supabase-doctor
        continue-on-error: true

      - name: Publish checks
        run: pnpm run check:publish

  stack:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: |
          supabase start
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.publishable_key=SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SECRET_KEY \
            --override-name auth.jwt_secret=SUPABASE_JWT_SECRET \
            --override-name db.url=SUPABASE_DB_URL \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      - name: Build
        run: pnpm run build

      - name: Integration
        run: pnpm run test:integration

      - name: End-to-end
        run: pnpm run test:e2e

      - name: Validation (lienlink on the stack)
        run: pnpm --filter @better-supabase/validation-lienlink test
