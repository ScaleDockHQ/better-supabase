name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache: "false"

      - name: Lint the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

  # release.yml runs the same gate on every push to main.
  verify:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: $/.github/workflows/verify.yml
    with:
      affected: true
      base: ${{ github.event.pull_request.base.sha }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  # Vercel is the other place the docs build runs, and a failing preview there doesn't block a
  # merge. MDX parse errors only surface when Fumadocs compiles the pages.
  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Build the docs
        run: /usr/bin/time -v -o build-usage.txt pnpm exec turbo run build --filter=docs

      - name: Log the build's memory and time
        if: always() && hashFiles('build-usage.txt') != ''
        run: |
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" build-usage.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # A pull request that touches neither the library, the suites that run on the stack, nor the
  # stack itself skips Integration and Realtime. Pushes to main always run them.
  affected:
    name: Affected
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      stack: ${{ steps.query.outputs.stack }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `turbo query affected` needs the merge base; a shallow checkout marks everything.
          fetch-depth: 0

      - uses: $/.github/actions/setup

      - id: query
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          packages=$(pnpm exec turbo query affected --base "$BASE" --head HEAD --packages \
            better-supabase \
            @better-supabase/example-nextjs \
            @better-supabase/validation-centrakit \
            @better-supabase/validation-recipes \
            @better-supabase/validation-presets \
            @better-supabase/validation-request-context \
            | jq '.data.affectedPackages.length')
          files=$(git diff --name-only "$BASE"...HEAD -- \
            supabase .github/actions/supabase-stack .github/workflows/ci.yml | wc -l)
          if [ "$packages" -gt 0 ] || [ "$files" -gt 0 ]; then
            echo "stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "stack=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs next to verify, not after it: Integration is the longest job, so waiting for verify would
  # add its whole runtime to the critical path. Each shard starts its own stack.
  stack:
    name: Integration (${{ matrix.name }})
    needs: affected
    # `affected` is skipped on push, and a skipped need skips this job unless `!cancelled()`.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.affected.outputs.stack == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Vitest shards by file count, not duration. The pg-delta round trip takes about two
      # minutes on its own (the other files take seconds), so it gets its own job.
      matrix:
        include:
          - name: 1/3
            args: --shard=1/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: 2/3
            args: --shard=2/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: 3/3
            args: --shard=3/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: pg-delta round trip
            args: tests/integration/pgdelta-roundtrip.integration.test.ts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # config.toml points signing_keys_path at this gitignored file, so the stack signs and
      # verifies ES256 tokens like a hosted project. The stack needs it before it starts, and it
      # starts in about 15 seconds, so starting it as a background step would save nothing.
      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      - name: Integration
        env:
          ARGS: ${{ matrix.args }}
        run: |
          read -ra args <<< "$ARGS"
          pnpm exec dotenv -e .env.development.local -- \
            pnpm --filter better-supabase exec vitest run --project integration "${args[@]}"

  # Its own jobs, so they run next to the shards instead of after one of them. CentraKit takes
  # about as long as the other three suites together.
  validation:
    name: Integration (${{ matrix.name }})
    needs: affected
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.affected.outputs.stack == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CentraKit
            filters: --filter @better-supabase/validation-centrakit
          - name: validation projects
            filters: >-
              --filter @better-supabase/validation-recipes
              --filter @better-supabase/validation-presets
              --filter @better-supabase/validation-request-context
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      # --workspace-concurrency=1: the suites share the stack's database.
      - name: Validation projects on the stack
        env:
          FILTERS: ${{ matrix.filters }}
        run: |
          read -ra filters <<< "$FILTERS"
          pnpm exec dotenv -e .env.development.local -- \
            pnpm --workspace-concurrency=1 "${filters[@]}" test

  # As of CLI 2.121.0 the stack engine's Realtime denies private channel joins
  # that the Docker stack allows, so these suites also run on the legacy engine.
  realtime:
    name: Integration (Realtime on the legacy engine)
    needs: affected
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.affected.outputs.stack == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SUPABASE_EXPERIMENTAL_STACK: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      - name: Realtime suites
        run: >-
          pnpm exec dotenv -e .env.development.local --
          pnpm --filter better-supabase exec vitest run --project integration
          tests/integration/realtime.integration.test.ts
          tests/integration/permissions-policies.integration.test.ts
