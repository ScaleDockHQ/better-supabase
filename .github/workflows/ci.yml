name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache: "false"

      - name: Lint the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

  # release.yml runs the same gate on every push to main.
  verify:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: $/.github/workflows/verify.yml
    with:
      affected: true
      base: ${{ github.event.pull_request.base.sha }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  # Vercel production builds the docs on push. A pull request builds them here only when the
  # docs package changed, because a failing preview does not block a merge.
  docs:
    name: Docs build
    needs: affected
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.affected.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Build the docs
        run: /usr/bin/time -v -o build-usage.txt pnpm exec turbo run build --filter=docs

      - name: Log the build's memory and time
        if: always() && hashFiles('build-usage.txt') != ''
        run: |
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" build-usage.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Vite's example builds here. The Next.js example builds in `verify / test`, which measures
  # its output, so a second build would miss the Turbo cache for both.
  adapter-builds:
    name: Adapter build (${{ matrix.name }})
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.vite == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vite and React
            filter: "@better-supabase/example-vite-react"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Build the example
        env:
          FILTER: ${{ matrix.filter }}
        run: pnpm exec turbo run build --filter="$FILTER"

  # A change that touches neither the library, the suites that run on the stack, nor the stack
  # itself skips Integration and Realtime. Pushes use the previous commit on the branch.
  affected:
    name: Affected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      stack: ${{ steps.query.outputs.stack }}
      docs: ${{ steps.query.outputs.docs }}
      nextjs: ${{ steps.query.outputs.nextjs }}
      vite: ${{ steps.query.outputs.vite }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `turbo query affected` needs the merge base; a shallow checkout marks everything.
          fetch-depth: 0

      - uses: $/.github/actions/setup

      - id: query
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          mark_all() {
            {
              echo "stack=true"
              echo "docs=true"
              echo "nextjs=true"
              echo "vite=true"
            } >> "$GITHUB_OUTPUT"
          }
          # A new branch, a force-push, or a missing base has no ancestor to diff against.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || ! git merge-base --is-ancestor "$BASE" HEAD; then
            mark_all
            exit 0
          fi
          json=$(pnpm exec turbo query affected --base "$BASE" --head HEAD --packages \
            better-supabase \
            docs \
            @better-supabase/example-nextjs \
            @better-supabase/example-vite-react \
            @better-supabase/validation-centrakit \
            @better-supabase/validation-recipes \
            @better-supabase/validation-presets \
            @better-supabase/validation-request-context)
          names=$(printf '%s' "$json" | jq -r '.data.affectedPackages.items[].name')
          flag() {
            if printf '%s\n' "$names" | grep -qx "$1"; then
              echo "$2=true" >> "$GITHUB_OUTPUT"
            else
              echo "$2=false" >> "$GITHUB_OUTPUT"
            fi
          }
          files=$(git diff --name-only "$BASE"...HEAD -- \
            supabase .github/actions/supabase-stack .github/workflows/ci.yml | wc -l)
          if printf '%s\n' "$names" | grep -qx better-supabase \
            || printf '%s\n' "$names" | grep -qx @better-supabase/example-nextjs \
            || printf '%s\n' "$names" | grep -qx @better-supabase/validation-centrakit \
            || printf '%s\n' "$names" | grep -qx @better-supabase/validation-recipes \
            || printf '%s\n' "$names" | grep -qx @better-supabase/validation-presets \
            || printf '%s\n' "$names" | grep -qx @better-supabase/validation-request-context \
            || [ "$files" -gt 0 ]; then
            echo "stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "stack=false" >> "$GITHUB_OUTPUT"
          fi
          flag docs docs
          flag @better-supabase/example-nextjs nextjs
          flag @better-supabase/example-vite-react vite

  # Runs next to verify, not after it: Integration is the longest job, so waiting for verify would
  # add its whole runtime to the critical path. Each shard starts its own stack.
  stack:
    name: Integration (${{ matrix.name }})
    needs: affected
    # A skipped or failed affected job must not start the stack.
    if: ${{ !cancelled() && needs.affected.outputs.stack == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Vitest shards by file count, not duration. The pg-delta round trip takes about two
      # minutes on its own (the other files take seconds), so it gets its own job.
      matrix:
        include:
          - name: 1/3
            args: --shard=1/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: 2/3
            args: --shard=2/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: 3/3
            args: --shard=3/3 --exclude=tests/integration/pgdelta-roundtrip.integration.test.ts
          - name: pg-delta round trip
            args: tests/integration/pgdelta-roundtrip.integration.test.ts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # config.toml points signing_keys_path at this gitignored file, so the stack signs and
      # verifies ES256 tokens like a hosted project. The stack needs it before it starts, and it
      # starts in about 15 seconds, so starting it as a background step would save nothing.
      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      - name: Integration
        env:
          ARGS: ${{ matrix.args }}
        run: |
          read -ra args <<< "$ARGS"
          pnpm exec dotenv -e .env.development.local -- \
            pnpm --filter better-supabase exec vitest run --project integration "${args[@]}"

  # Its own jobs, so they run next to the shards instead of after one of them. CentraKit takes
  # about as long as the other three suites together.
  validation:
    name: Integration (${{ matrix.name }})
    needs: affected
    if: ${{ !cancelled() && needs.affected.outputs.stack == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CentraKit
            filters: --filter @better-supabase/validation-centrakit
          - name: validation projects
            filters: >-
              --filter @better-supabase/validation-recipes
              --filter @better-supabase/validation-presets
              --filter @better-supabase/validation-request-context
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      # --workspace-concurrency=1: the suites share the stack's database.
      - name: Validation projects on the stack
        env:
          FILTERS: ${{ matrix.filters }}
        run: |
          read -ra filters <<< "$FILTERS"
          pnpm exec dotenv -e .env.development.local -- \
            pnpm --workspace-concurrency=1 "${filters[@]}" test
