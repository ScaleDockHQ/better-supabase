name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  SUPABASE_CLI_VERSION: 2.118.0

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for the Vercel Remote Cache.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `turbo --affected` compares against the base branch.
          fetch-depth: 0

      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM || 'scaledock' }}

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Typecheck matrix (TypeScript 5.9, 6, 7)
        run: pnpm run typecheck:matrix

      - name: Type performance
        run: pnpm run typecheck:perf

      - name: Test (affected)
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec turbo run test --affected

      - name: Test
        if: github.event_name != 'pull_request'
        run: pnpm run test

      - name: Size
        run: pnpm run size

      - name: Generated code drift
        run: |
          for project in apps/examples/* tests/validation-*; do
            pnpm exec better-supabase gen --check --cwd "$project"
          done

      - name: Doctor (SARIF)
        run: pnpm exec better-supabase doctor --cwd apps/examples/nextjs --format sarif --out doctor.sarif

      - name: Upload doctor findings
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: doctor.sarif
          category: better-supabase-doctor
        continue-on-error: true

      - name: Publish checks
        run: pnpm run check:publish

  stack:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM || 'scaledock' }}

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # config.toml points signing_keys_path at this gitignored file, so the
      # stack signs and verifies ES256 tokens like a hosted project.
      - name: Create the local signing key
        run: node packages/better-supabase/src/cli/bin.ts keys --cwd .

      - name: Start Supabase
        run: |
          supabase start
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.publishable_key=SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SECRET_KEY \
            --override-name auth.jwt_secret=SUPABASE_JWT_SECRET \
            --override-name db.url=SUPABASE_DB_URL \
            | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      # Restored from the remote cache when the check job built the same inputs.
      - name: Build
        run: pnpm run build

      - name: Integration
        run: pnpm run test:integration

      - name: Install Chromium (instant navigation tests)
        run: pnpm --filter @better-supabase/e2e exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm run test:e2e

      - name: Validation (request context on the stack)
        run: pnpm --filter @better-supabase/validation-request-context test
