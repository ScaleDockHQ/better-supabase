name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".cursor/**"
      - ".claude/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: "false"

      - name: Lint the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

  verify:
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/verify.yml
    with:
      affected: ${{ github.event_name == 'pull_request' }}
      base: ${{ github.event.pull_request.base.sha || '' }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  stack:
    name: Integration
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # config.toml points signing_keys_path at this gitignored file, so the
      # stack signs and verifies ES256 tokens like a hosted project.
      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm exec better-supabase keys --cwd .

      - name: Start Supabase
        uses: ./.github/actions/supabase-stack

      - name: Integration
        run: pnpm run test:integration

      - name: Validation (request context on the stack)
        run: >-
          pnpm exec dotenv -e .env.development.local --
          pnpm --filter @better-supabase/validation-request-context test

  # As of CLI 2.121.0 the stack engine's Realtime denies private channel joins
  # that the Docker stack allows, so these suites also run on the legacy engine.
  realtime:
    name: Integration (Realtime on the legacy engine)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    env:
      SUPABASE_EXPERIMENTAL_STACK: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm exec better-supabase keys --cwd .

      - name: Start Supabase
        uses: ./.github/actions/supabase-stack

      - name: Realtime suites
        run: >-
          pnpm exec dotenv -e .env.development.local --
          pnpm --filter better-supabase exec vitest run --project integration
          tests/integration/realtime.integration.test.ts
          tests/integration/access-policies.integration.test.ts
