name: Verify

# Every `pnpm verify` gate and nothing else, so local and CI results agree. `ci.yml` calls it on pull
# requests and `release.yml` on the release commit.

on:
  workflow_call:
    inputs:
      affected:
        description: Run Turbo tasks only for packages changed since the base commit.
        type: boolean
        default: false
      base:
        description: Base commit for `turbo --affected` and for the unit test selection.
        type: string
        default: ""
      full:
        description: Run the library's whole unit suite with the coverage thresholds, not the selected tests.
        type: boolean
        default: false
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        description: Signs and verifies Remote Cache artifacts.
        required: false

permissions:
  contents: read

env:
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  TURBO_SCM_BASE: ${{ inputs.base }}
  AFFECTED: ${{ inputs.affected && '--affected' || '' }}
  FULL: ${{ inputs.full }}
  BASE: ${{ inputs.base }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # The cheap gates run as three lanes, so the first failure from lint or a script check arrives
  # within a few minutes and the slowest lane sets the wall time instead of their sum.
  static:
    name: static (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC token for the Vercel Remote Cache.
      id-token: write
      # Doctor uploads SARIF to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: lint
            tasks: >-
              lint lint:root typecheck:tooling check:prose check:skills check:adrs check:agent-docs
          - lane: checks
            tasks: >-
              check:app-architecture check:empty-translations check:example-coverage
              check:migration-order check:naming check:no-permdock
              recipes:check skill-references:check test:scripts catalog:check docs:drift knip
          - lane: generated
            # The ts-7.1 leg runs the content mapper and runs nightly (nightly.yml); ts-6 and ts-7 gate every PR.
            tasks: gen:check doctor:sarif typecheck:matrix --filter=!@better-supabase/types-ts71
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `turbo --affected` and `check:migration-order` need the merge base, not old file contents.
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup
        with:
          save-cache: ${{ matrix.lane == 'lint' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # `test:scripts` runs the `check-changed` tests, which search with `rg`; the runner image has none.
      - name: Install ripgrep
        if: matrix.lane == 'checks'
        run: sudo apt-get install --yes --no-install-recommends ripgrep

      - parallel:
          - name: Workspace tasks
            env:
              TASKS: ${{ matrix.tasks }}
            run: |
              read -ra tasks <<< "$TASKS"
              read -ra affected <<< "$AFFECTED"
              pnpm exec turbo run "${tasks[@]}" "${affected[@]}" --log-file
          - name: Format
            if: matrix.lane == 'lint'
            run: pnpm run format:check
          - name: Boundaries
            if: matrix.lane == 'lint'
            run: pnpm run boundaries
          - name: Audit
            if: matrix.lane == 'checks'
            run: pnpm run audit:high
          - name: Publish checks
            if: matrix.lane == 'generated'
            run: pnpm run check:publish
          - name: Lint the PR title
            if: ${{ github.event_name == 'pull_request' && matrix.lane == 'lint' }}
            env:
              TITLE: ${{ github.event.pull_request.title }}
            run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      # `doctor:sarif` is the only doctor run in CI: it prints the findings and restores `doctor.sarif` on a cache hit.
      - name: Upload doctor findings
        if: always() && matrix.lane == 'generated' && hashFiles('apps/examples/nextjs/doctor.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: apps/examples/nextjs/doctor.sarif
          category: better-supabase-doctor
        continue-on-error: true

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-static-${{ matrix.lane }}
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7

  # CPU-heavy gates get a machine each.
  heavy:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The library's unit tests run in the `unit` shards below, and the Next.js example's
          # build and size baselines in `next build`, which is the slowest task of this group.
          # The shadow-database sync suites run nightly (nightly.yml).
          - task: test
            run: >-
              pnpm exec turbo run test --filter=!better-supabase
              --filter=!@better-supabase/next-build --filter=!@better-supabase/example-nextjs
              $AFFECTED --log-file
          - task: next build
            run: >-
              pnpm exec turbo run test --filter=@better-supabase/next-build
              --filter=@better-supabase/example-nextjs $AFFECTED --log-file
          # Next typechecks run one at a time on GitHub-hosted runners.
          - task: typecheck
            run: pnpm exec turbo run typecheck --concurrency=1 $AFFECTED --log-file
          # A benchmark: it gets a machine to itself so its timings stay comparable.
          # Pull requests gate the exact counts; the time limits run nightly (nightly.yml).
          - task: type performance
            run: BENCH_TIME_GATES=0 pnpm exec turbo run typecheck:perf
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup

      - name: ${{ matrix.task }}
        run: ${{ matrix.run }}

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-${{ strategy.job-index }}
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7

  # The library's unit tests run on one machine, which gives every Vitest worker the same file
  # queue. A pull request runs the tests its diff can reach (scripts/select-tests.ts) without
  # coverage; the release commit runs the whole suite and checks the coverage thresholds.
  # UNIT_RUNNER is the label of a larger runner; a fork's pull request can't use it.
  unit:
    name: unit
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || vars.UNIT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup

      - name: Build the library
        # The tests import the built package. The build takes no `--affected`: it is cheap on a
        # cache hit and `dist` must exist for every test.
        run: |
          node --input-type=module -e 'import { availableParallelism } from "node:os"; console.log("availableParallelism", availableParallelism())'
          pnpm exec turbo run build --filter=better-supabase --log-file

      - name: Whole suite with coverage
        if: ${{ inputs.full }}
        run: |
          read -ra affected <<< "$AFFECTED"
          pnpm exec turbo run test --filter=better-supabase --only "${affected[@]}" --log-file -- --coverage

      - name: Selected tests
        if: ${{ !inputs.full }}
        run: |
          # A selection error widens to the whole suite instead of skipping tests.
          selection=$(node scripts/select-tests.ts "$BASE" 2>/tmp/selection-reasons.txt || echo full)
          cat /tmp/selection-reasons.txt >> "$GITHUB_STEP_SUMMARY" || true
          mode=$(printf '%s\n' "$selection" | head -1)
          cd packages/better-supabase
          if [ "$mode" = "full" ]; then
            echo "The selector widened to the whole suite."
            pnpm exec vitest run --project unit
          elif [ "$mode" = "files 0" ]; then
            echo "No unit test can reach this change."
          else
            mapfile -t files < <(printf '%s\n' "$selection" | tail -n +2)
            echo "Running ${#files[@]} test files."
            pnpm exec vitest run --project unit "${files[@]}"
          fi

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-unit
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7
