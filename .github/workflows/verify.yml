name: Verify

# Every `pnpm verify` gate and nothing else, so local and CI results agree. `ci.yml` calls it on pull
# requests and `release.yml` on the release commit.

on:
  workflow_call:
    inputs:
      affected:
        description: Run Turbo tasks only for packages changed since the base commit.
        type: boolean
        default: false
      base:
        description: Base commit for `turbo --affected`.
        type: string
        default: ""
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        description: Signs and verifies Remote Cache artifacts.
        required: false

permissions:
  contents: read

env:
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  TURBO_SCM_BASE: ${{ inputs.base }}
  AFFECTED: ${{ inputs.affected && '--affected' || '' }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # The cheap gates share one machine and one install.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC token for the Vercel Remote Cache.
      id-token: write
      # Doctor uploads SARIF to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `turbo --affected` needs the merge base, not old file contents.
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup
        with:
          save-cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - parallel:
          - name: Workspace tasks
            run: >-
              pnpm exec turbo run
              lint lint:root typecheck:tooling check:prose check:migration-order check:no-permdock recipes:check
              catalog:check docs:drift knip gen:check doctor typecheck:matrix
              $AFFECTED --log-file
          - name: Format
            run: pnpm run format:check
          - name: Boundaries
            run: pnpm run boundaries
          - name: Audit
            run: pnpm run audit:high

      # After the group, so the build comes from the Turbo cache the workspace tasks filled.
      - name: Doctor SARIF
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase doctor --cwd apps/examples/nextjs --format sarif --out doctor.sarif

      - name: Upload doctor findings
        if: always() && hashFiles('doctor.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: doctor.sarif
          category: better-supabase-doctor
        continue-on-error: true

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-static
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7

  # CPU-heavy gates get a machine each.
  heavy:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The library's unit tests run in the `unit` shards below.
          - task: test
            run: pnpm exec turbo run test --filter=!better-supabase $AFFECTED --log-file
          # Next typechecks run one at a time on GitHub-hosted runners.
          - task: typecheck
            run: pnpm exec turbo run typecheck --concurrency=1 $AFFECTED --log-file
          - task: publish checks
            run: pnpm run check:publish
          # A benchmark: it gets a machine to itself so its timings stay comparable.
          - task: type performance
            run: pnpm exec turbo run typecheck:perf
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup

      - name: ${{ matrix.task }}
        run: ${{ matrix.run }}

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-${{ strategy.job-index }}
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7

  # The library's unit tests with coverage took over 11 minutes on one runner. Each shard writes
  # a blob report (Turbo restores it on a cache hit), and `coverage` merges them and checks the
  # thresholds; a shard checks none.
  unit:
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup

      - name: Unit tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          read -ra affected <<< "$AFFECTED"
          pnpm exec turbo run test --filter=better-supabase "${affected[@]}" --log-file -- \
            --shard="$SHARD/3" --reporter=blob

      # The blob reporter prints no failures, so a failed shard replays its own report.
      - name: Show the failed tests
        if: failure()
        run: pnpm --filter better-supabase exec vitest --merge-reports --reporter=default

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-blob-${{ matrix.shard }}
          path: packages/better-supabase/.vitest/blob/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-unit-${{ matrix.shard }}
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: coverage
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          pattern: unit-blob-*
          path: packages/better-supabase/.vitest/blob
          merge-multiple: true

      # With --affected, the shards skip the library when nothing it depends on changed. Ask Turbo
      # the same question, so a missing upload fails instead of passing as "not affected".
      - name: Merge the shards and check the thresholds
        run: |
          read -ra affected <<< "$AFFECTED"
          selected=$(pnpm exec turbo run test --filter=better-supabase "${affected[@]}" --dry=json \
            | jq '[.tasks[] | select(.taskId == "better-supabase#test")] | length')
          blobs=$(find packages/better-supabase/.vitest/blob -name 'blob-*.json' 2>/dev/null | wc -l)
          if [ "$selected" -eq 0 ]; then
            echo "The library is not affected; nothing to merge."
            exit 0
          fi
          if [ "$blobs" -ne 3 ]; then
            echo "Expected 3 blob reports, found $blobs."
            exit 1
          fi
          pnpm --filter better-supabase exec vitest --merge-reports --coverage
