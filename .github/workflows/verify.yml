name: Verify

# Every `pnpm verify` gate and nothing else, so local and CI results agree. `ci.yml` calls it on pull
# requests and `release.yml` on the release commit.

on:
  workflow_call:
    inputs:
      affected:
        description: Run Turbo tasks only for packages changed since the base commit.
        type: boolean
        default: false
      base:
        description: Base commit for `turbo --affected`.
        type: string
        default: ""
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        description: Signs and verifies Remote Cache artifacts.
        required: false

permissions:
  contents: read

env:
  # The TUI swallows task output on non-TTY runners.
  TURBO_UI: stream
  TURBO_SCM_BASE: ${{ inputs.base }}
  AFFECTED: ${{ inputs.affected && '--affected' || '' }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # The cheap gates run as three lanes, so the first failure from lint or a script check arrives
  # within a few minutes and the slowest lane sets the wall time instead of their sum.
  static:
    name: static (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC token for the Vercel Remote Cache.
      id-token: write
      # Doctor uploads SARIF to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: lint
            tasks: >-
              lint lint:root typecheck:tooling check:prose check:skills check:adrs check:agent-docs
          - lane: checks
            tasks: >-
              check:app-architecture check:empty-translations check:example-coverage
              check:example-findings check:migration-order check:naming check:no-permdock
              recipes:check skill-references:check test:scripts catalog:check docs:drift knip
          - lane: generated
            # The ts-7.1 leg runs the content mapper and runs nightly (nightly.yml); ts-6 and ts-7 gate every PR.
            tasks: gen:check doctor:sarif typecheck:matrix --filter=!@better-supabase/types-ts71
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `turbo --affected` and `check:migration-order` need the merge base, not old file contents.
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup
        with:
          save-cache: ${{ matrix.lane == 'lint' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # `test:scripts` runs the `check-changed` tests, which search with `rg`; the runner image has none.
      - name: Install ripgrep
        if: matrix.lane == 'checks'
        run: sudo apt-get install --yes --no-install-recommends ripgrep

      - parallel:
          - name: Workspace tasks
            env:
              TASKS: ${{ matrix.tasks }}
            run: |
              read -ra tasks <<< "$TASKS"
              read -ra affected <<< "$AFFECTED"
              pnpm exec turbo run "${tasks[@]}" "${affected[@]}" --log-file
          - name: Format
            if: matrix.lane == 'lint'
            run: pnpm run format:check
          - name: Boundaries
            if: matrix.lane == 'lint'
            run: pnpm run boundaries
          - name: Audit
            if: matrix.lane == 'checks'
            run: pnpm run audit:high
          - name: Publish checks
            if: matrix.lane == 'generated'
            run: pnpm run check:publish
          - name: Lint the PR title
            if: ${{ github.event_name == 'pull_request' && matrix.lane == 'lint' }}
            env:
              TITLE: ${{ github.event.pull_request.title }}
            run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      # `doctor:sarif` is the only doctor run in CI: it prints the findings and restores `doctor.sarif` on a cache hit.
      - name: Upload doctor findings
        if: always() && matrix.lane == 'generated' && hashFiles('apps/examples/nextjs/doctor.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: apps/examples/nextjs/doctor.sarif
          category: better-supabase-doctor
        continue-on-error: true

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-static-${{ matrix.lane }}
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7

  # CPU-heavy gates get a machine each.
  heavy:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The library's unit tests run in the `unit` shards below, and the Next.js example's
          # build and size baselines in `next build`, which is the slowest task of this group.
          # The shadow-database sync suites run nightly (nightly.yml).
          - task: test
            run: >-
              pnpm exec turbo run test --filter=!better-supabase
              --filter=!@better-supabase/next-build --filter=!@better-supabase/example-nextjs
              $AFFECTED --log-file
          - task: next build
            run: >-
              pnpm exec turbo run test --filter=@better-supabase/next-build
              --filter=@better-supabase/example-nextjs $AFFECTED --log-file
          # Next typechecks run one at a time on GitHub-hosted runners.
          - task: typecheck
            run: pnpm exec turbo run typecheck --concurrency=1 $AFFECTED --log-file
          # A benchmark: it gets a machine to itself so its timings stay comparable.
          # Pull requests gate the exact counts; the time limits run nightly (nightly.yml).
          - task: type performance
            run: BENCH_TIME_GATES=0 pnpm exec turbo run typecheck:perf
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup

      - name: ${{ matrix.task }}
        run: ${{ matrix.run }}

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-${{ strategy.job-index }}
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7

  # The library's unit tests with coverage took over 11 minutes on one runner. Each shard writes
  # a blob report (Turbo restores it on a cache hit), and `coverage` merges them and checks the
  # thresholds; a shard checks none.
  unit:
    name: unit (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup

      - name: Unit tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          read -ra affected <<< "$AFFECTED"
          # Log the core count. Vitest uses one worker per core unless maxWorkers is set.
          node --input-type=module -e 'import { availableParallelism } from "node:os"; console.log("availableParallelism", availableParallelism())'
          # Passthrough arguments enter every task hash, so the build runs without them and hits
          # the cache; only the test takes `--shard`. The build takes no `--affected`: the test
          # task is affected by test and config files the build task never reads, and the tests
          # import the built package, so an affected-only build leaves `dist` missing.
          pnpm exec turbo run build --filter=better-supabase --log-file
          pnpm exec turbo run test --filter=better-supabase --only "${affected[@]}" --log-file -- \
            --shard="$SHARD/6" --reporter=blob --coverage

      # The blob reporter prints no failures, so a failed shard replays its own report.
      - name: Show the failed tests
        if: failure()
        run: pnpm --filter better-supabase exec vitest --merge-reports --reporter=default

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-blob-${{ matrix.shard }}
          path: packages/better-supabase/.vitest/blob/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the Turbo logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: turbo-logs-unit-${{ matrix.shard }}
          path: .turbo/logs/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: coverage
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: $/.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          pattern: unit-blob-*
          path: packages/better-supabase/.vitest/blob
          merge-multiple: true

      # With --affected, the shards skip the library when nothing it depends on changed. Ask Turbo
      # the same question, so a missing upload fails instead of passing as "not affected".
      - name: Merge the shards and check the thresholds
        run: |
          read -ra affected <<< "$AFFECTED"
          selected=$(pnpm exec turbo run test --filter=better-supabase "${affected[@]}" --dry=json \
            | jq '[.tasks[] | select(.taskId == "better-supabase#test")] | length')
          blobs=$(find packages/better-supabase/.vitest/blob -name 'blob-*.json' 2>/dev/null | wc -l)
          if [ "$selected" -eq 0 ]; then
            echo "The library is not affected; nothing to merge."
            exit 0
          fi
          if [ "$blobs" -ne 6 ]; then
            echo "Expected 6 blob reports, found $blobs."
            exit 1
          fi
          # JSON keeps the per-file times for the summary. The process still fails on thresholds.
          status=0
          pnpm --filter better-supabase exec vitest --merge-reports --coverage \
            --reporter=json --outputFile=/tmp/unit-report.json || status=$?
          if [ -f /tmp/unit-report.json ]; then
            node scripts/unit-durations.ts --summary /tmp/unit-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
