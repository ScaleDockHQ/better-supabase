name: Supabase latest

# better-supabase builds directly on @supabase/server and @supabase/middleware,
# which still ship breaking changes in minor releases. This job runs the full
# test suite against their newest versions every night, so a break shows up
# here before users hit it. `@latest` still respects minimumReleaseAge, so a
# release joins the run once it is a day old.

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: Europe/Amsterdam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # OIDC token for the Vercel Remote Cache. The changed lockfile is part of every task hash,
      # so these results never stand in for main's.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Restores the store from main; the changed lockfile never writes back to the cache.
      - uses: $/.github/actions/setup
        with:
          save-cache: "false"

      - name: Install latest Supabase packages
        run: |
          pnpm --filter better-supabase add -D \
            @supabase/server@latest @supabase/middleware@latest \
            @supabase/ssr@latest @supabase/supabase-js@latest \
            --config.catalogMode=manual

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
