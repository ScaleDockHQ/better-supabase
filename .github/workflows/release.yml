name: Release

on:
  push:
    branches: [main]

# Release runs wait in order; none is dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions: {}

jobs:
  # The last main commit whose Release verify passed. A full verify runs when that
  # commit is missing or is not an ancestor, for example after a force-push.
  base:
    name: Affected base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      affected: ${{ steps.base.outputs.affected }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Find the last green Release commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          head=$(git rev-parse HEAD)
          if [ -n "$sha" ] && [ "$sha" != "$head" ] \
            && git cat-file -e "$sha^{commit}" \
            && git merge-base --is-ancestor "$sha" HEAD; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "base=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

  # The same gate as CI, on the release commit, for what changed since the last green run.
  verify:
    needs: base
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: $/.github/workflows/verify.yml
    with:
      affected: ${{ needs.base.outputs.affected == 'true' }}
      base: ${{ needs.base.outputs.base }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  select-mode:
    name: Select mode
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # changesets/action pushes the release branch with the checkout's token.
      - uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - uses: $/.github/actions/setup

      - name: Create or update the release pull request
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Also writes the root CHANGELOG.md and formats the result.
          script: pnpm run version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          # @changesets/changelog-github looks up the PR and author of each changeset.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm trusted publishing: the registry trusts this workflow file and the `npm`
  # environment through OIDC, so no npm token exists anywhere. Publishing stays
  # off until the repository variable NPM_PUBLISH is 'true'.
  publish:
    name: Publish to npm
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A poisoned cache never reaches a publish.
    cache-mode: none
    # The environment only gates the OIDC trust; the run is not a deployment.
    environment:
      name: npm
      deployment: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require a public repository
        if: github.event.repository.private
        run: |
          echo "::error::npm only accepts provenance from public repositories. Make ${{ github.repository }} public before publishing."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # No store cache in the job that can mint npm credentials.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node
          node-version-file: .node-version
          cache: false
          require-lockfile: true

      # The pnpm runtime ships no npm; trusted publishing needs npm >= 11.5.1.
      # The version is exact, and the job runs no other code from the registry.
      - name: Install npm 11
        run: | # zizmor: ignore[adhoc-packages]
          pnpm add --global npm@11.20.0
          npm --version

      - name: Publish
        id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Builds, then runs `changeset publish`.
          script: pnpm run release
          # The next step writes the releases, because GitHub rejects notes
          # above 125,000 characters and the action doesn't truncate.
          create-github-releases: false
          push-git-tags: true
        env:
          PNPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_PROVENANCE: "true"

      - name: Create GitHub releases
        if: steps.publish.outputs.published == 'true'
        run: node scripts/github-releases.ts
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.publish.outputs.published-packages }}
