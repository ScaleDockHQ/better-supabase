name: Database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/better-supabase/src/cli/doctor/**"
      - ".github/workflows/database.yml"
      - ".github/actions/supabase-stack/**"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/better-supabase/src/cli/doctor/**"
      - ".github/workflows/database.yml"
      - ".github/actions/supabase-stack/**"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm exec better-supabase keys --cwd .

      - name: Start Supabase
        uses: ./.github/actions/supabase-stack

      - name: Migrations match supabase/schemas
        run: |
          pnpm exec supabase db schema declarative sync --no-apply --strict-coverage -f drift < /dev/null
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            git status --porcelain supabase/migrations
            echo "supabase/schemas changed without a migration. Run pnpm supabase:sync <name>."
            exit 1
          fi

      - name: pgTAP
        run: pnpm exec supabase test db

      - name: Lint SQL
        run: pnpm exec supabase db lint --local --level warning --fail-on error

      - name: Supabase advisors
        run: pnpm exec supabase db advisors --local --type all --fail-on warn

      - name: Doctor against the stack
        run: >-
          pnpm exec dotenv -e .env.development.local --
          sh -c 'printf %s "$SUPABASE_DB_URL"
          | pnpm exec better-supabase doctor --cwd apps/examples/nextjs --db-url-stdin --strict'
