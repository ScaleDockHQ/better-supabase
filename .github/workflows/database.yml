name: Database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/better-supabase/src/cli/doctor/**"
      - ".github/workflows/database.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/better-supabase/src/cli/doctor/**"
      - ".github/workflows/database.yml"

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  SUPABASE_CLI_VERSION: 2.119.0
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Runs before checkout: the action runs npm in the workspace, and npm
      # rejects the root package.json, whose devEngines require pnpm.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm exec better-supabase keys --cwd .

      - name: Start Supabase
        run: supabase start

      - name: Migrations match supabase/schemas
        run: |
          supabase db schema declarative sync --no-apply --strict-coverage -f drift < /dev/null
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            git status --porcelain supabase/migrations
            echo "supabase/schemas changed without a migration. Run pnpm supabase:sync <name>."
            exit 1
          fi

      - name: pgTAP
        run: supabase test db

      - name: Lint SQL
        run: supabase db lint --local --level warning --fail-on error

      - name: Supabase advisors
        run: supabase db advisors --local --type all --fail-on warn

      - name: Doctor against the stack
        run: |
          echo "postgresql://postgres:postgres@127.0.0.1:55422/postgres" \
            | pnpm exec better-supabase doctor --cwd apps/examples/nextjs --db-url-stdin --strict
