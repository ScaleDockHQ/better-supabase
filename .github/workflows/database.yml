name: Database

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/better-supabase/src/cli/doctor/**"
      - "packages/better-supabase/src/sql/**"
      - "packages/better-supabase/src/realtime/**"
      - "packages/better-supabase/src/cli/introspect/**"
      - "packages/better-supabase/src/cli/commands/introspect.ts"
      - "packages/better-supabase/src/cli/commands/snapshot.ts"
      - ".github/workflows/database.yml"
      - "apps/examples/nextjs/src/**"
      - ".github/actions/supabase-stack/**"
      - "pnpm-workspace.yaml"
      - "packages/better-supabase/src/workflow-sdk/world/**"
      - "packages/better-supabase/tests/workflow-sdk/world/**"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "packages/better-supabase/src/cli/doctor/**"
      - "packages/better-supabase/src/sql/**"
      - "packages/better-supabase/src/realtime/**"
      - "packages/better-supabase/src/cli/introspect/**"
      - "packages/better-supabase/src/cli/commands/introspect.ts"
      - "packages/better-supabase/src/cli/commands/snapshot.ts"
      - ".github/workflows/database.yml"
      - "apps/examples/nextjs/src/**"
      - ".github/actions/supabase-stack/**"
      - "pnpm-workspace.yaml"
      - "packages/better-supabase/src/workflow-sdk/world/**"
      - "packages/better-supabase/tests/workflow-sdk/world/**"

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # Schema checks and the runtime checks each start a stack, so neither waits on the other.
  schema:
    name: Schema
    # x64 until the Supabase native runtime is confirmed on arm.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Seed the library rows only
        # The pgTAP files create their own fixtures next to the library seed. The example app's
        # rows (seeds/example.sql, seeds/finance-demo.sql) reuse ids and names those files use.
        run: sed -i 's|^sql_paths = .*|sql_paths = ["./seed.sql"]|' supabase/config.toml

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      - name: Migrations match supabase/schemas
        run: |
          pnpm exec supabase db schema declarative sync --no-apply --strict-coverage -f drift < /dev/null
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            git status --porcelain supabase/migrations
            echo "supabase/schemas changed without a migration. Run pnpm supabase:diff <name>."
            exit 1
          fi

      - name: Snapshot matches the stack
        run: |
          # Tests add objects, so this checks the freshly migrated database.
          # shellcheck disable=SC2016
          pnpm exec dotenv -e .env.development.local -- \
            sh -c 'printf %s "$SUPABASE_DB_URL" | pnpm better-supabase gen --save-snapshot --cwd . --db-url-stdin --check' \
            || { echo "supabase/snapshot.json is stale. Run pnpm supabase:reset, then pnpm better-supabase gen --save-snapshot --cwd ."; exit 1; }

      - name: pgTAP
        # supabase test db streams pg_prove over the stack owner's HTTP endpoint, which drops
        # the request when a scale test prints nothing for about five and a half minutes.
        run: |
          pg_prove=$(find "$HOME/.supabase/cache/stack/slim-services/postgres" -path '*/linux-*/bin/pg_prove' -print -quit)
          test -n "$pg_prove"
          bin_dir=$(dirname "$pg_prove")
          # SUPABASE_DB_URL comes from the dotenv file, so the inner shell expands it.
          # shellcheck disable=SC2016
          BIN_DIR="$bin_dir" pnpm exec dotenv -e .env.development.local -- sh -c '
            "$BIN_DIR/psql" "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema extensions" &&
            "$BIN_DIR/pg_prove" --ext .sql --recurse --dbname "$SUPABASE_DB_URL" supabase/tests'

      - name: Lint SQL
        # `extensions` holds third-party code (PostGIS for the assets block),
        # whose own functions fail plpgsql_check.
        run: >-
          pnpm exec supabase db lint --local --level warning --fail-on error
          --schema api,better_supabase,public,rbac,workflow

      - name: Supabase advisors
        run: pnpm exec supabase db advisors --local --type all --fail-on warn

  runtime:
    name: Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Create the local signing key
        run: |
          pnpm exec turbo run build --filter=better-supabase...
          pnpm better-supabase dev keys --cwd .

      - name: Start Supabase
        uses: $/.github/actions/supabase-stack

      - name: World conformance
        # Runs the @workflow/world-testing suite against the Supabase World (ADR 0210). The
        # peer range allows 5.2.x only, so the catalog pin is both ends of the range.
        # The stack's connection string comes from the dotenv file at the repo root.
        run: >-
          pnpm exec dotenv -e .env.development.local --
          pnpm --filter better-supabase exec vitest run --project integration
          tests/integration/workflow-world.integration.test.ts
          --reporter=default --reporter=junit --outputFile.junit=world-conformance.xml

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: world-conformance
          path: packages/better-supabase/world-conformance.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Doctor against the stack
        run: |
          # SUPABASE_DB_URL comes from the dotenv file, so the inner shell expands it.
          # shellcheck disable=SC2016
          pnpm exec dotenv -e .env.development.local -- \
            sh -c 'printf %s "$SUPABASE_DB_URL" | pnpm better-supabase doctor --cwd apps/examples/nextjs --db-url-stdin --fail-on warning'
