# This file makes the folder its own Supabase project, so the declarative sync
# and the doctor tests run against its schema files and baseline migration.
project_id = "validation-declarative"

[api]
enabled = true
# New tables get no Data API grants until their schema file grants them.
auto_expose_new_tables = false

# pg-delta orders the files in schemas/ by dependency.
[experimental.pgdelta]
enabled = true
declarative_schema_path = "./schemas"
