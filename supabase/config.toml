project_id = "better-supabase"

[api]
enabled = true
port = 55421
# `api` holds the SQL modules' security-invoker entry points (sql.modules.<module>.api).
schemas = ["public", "graphql_public", "api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New tables get no Data API grants until 090_grants.sql gives them.
auto_expose_new_tables = false

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.customer-logos]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
# The nextjs example under `pnpm dev:portless`, and under `pnpm dev`.
site_url = "https://example.localhost"
additional_redirect_urls = [
  "https://example.localhost/**",
  "http://localhost:3100/**",
  "http://127.0.0.1:3100/**",
]
jwt_expiry = 3600
# Created by `better-supabase keys` (CI runs it before `supabase start`).
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# Lets MCP clients sign in through OAuth (apps/examples/mcp).
[auth.oauth_server]
enabled = true
# Relative to `site_url`: the Next.js example's consent page.
authorization_url_path = "/oauth/consent"

# The MCP example verifies tokens itself; the gateway's own 401 carries no
# OAuth challenge, so clients could not discover how to sign in.
[functions.mcp]
verify_jwt = false
entrypoint = "../apps/examples/mcp/supabase/functions/mcp/index.ts"

[auth.email]
enable_signup = true
enable_confirmations = false

# Two-factor sign-in in the Next.js example (settings, security, and /mfa).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Adds the `user_role`, `memberships` and `features` claims (supabase/schemas/040_rbac.sql).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/rbac/custom_access_token_hook"

[studio]
enabled = false
port = 55423

# The Next.js example's sign-up, password reset and invitation emails.
[local_smtp]
enabled = true
port = 55424

[analytics]
enabled = false
port = 55427

[db.pooler]
enabled = false
port = 55429

[edge_runtime]
enabled = false

# pg-delta orders the files in schemas/ by dependency. Generate a migration
# after an edit with `pnpm supabase:sync <name>`.
[experimental.pgdelta]
enabled = true
declarative_schema_path = "./schemas"
