project_id = "better-supabase"

# No port keys: the CLI picks ports for each checkout or git worktree and
# remembers them, so worktrees run their own stacks side by side. Read the
# URLs from `supabase status --env` (`pnpm env:local`).

[api]
enabled = true
# `api` holds the SQL modules' security-invoker entry points (blocks.<module>.api).
schemas = ["public", "graphql_public", "api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New tables get no Data API grants until their schema file grants them.
auto_expose_new_tables = false

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.customer-logos]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.avatars]
public = true
file_size_limit = "2MiB"
allowed_mime_types = [
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/gif",
  "image/avif",
]

[auth]
enabled = true
# The nextjs example under `pnpm dev:portless`, and under `pnpm dev`. The eve
# and Vite examples also sign in under `pnpm dev:portless`.
site_url = "https://example.localhost"
additional_redirect_urls = [
  "https://example.localhost/**",
  "https://eve.localhost/**",
  "https://vite-react.localhost/**",
  "http://localhost:3100/**",
  "http://127.0.0.1:3100/**",
]
jwt_expiry = 3600
# Created by `better-supabase keys` (CI runs it before `supabase start`).
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

# The Auth server's defaults, written out so a copy of this file keeps them.
[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

# Lets MCP clients sign in through OAuth (apps/examples/mcp).
[auth.oauth_server]
enabled = true
# Relative to `site_url`: the Next.js example's consent page.
authorization_url_path = "/oauth/consent"

# The MCP example verifies tokens itself; the gateway's own 401 carries no
# OAuth challenge, so clients could not discover how to sign in.
[functions.mcp]
verify_jwt = false
entrypoint = "../apps/examples/mcp/supabase/functions/mcp/index.ts"

[auth.email]
enable_signup = true
enable_confirmations = false
secure_password_change = true

# Two-factor sign-in in the Next.js example (settings, security, and /mfa).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Adds the `user_role`, `memberships` and `features` claims (supabase/schemas/rbac/functions/custom_access_token_hook.sql).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/rbac/custom_access_token_hook"

[studio]
enabled = false

# The Next.js example's sign-up, password reset and invitation emails.
[local_smtp]
enabled = true

[analytics]
enabled = false

[db.pooler]
enabled = false

[edge_runtime]
enabled = false

# The CLI's stack engine: services start on first request and stop when idle.
# CI runs it with `--runtime native`, which needs no Docker.
[experimental]
stack = true

# pg-delta orders the files in schemas/ by dependency. Generate a migration
# after an edit with `pnpm supabase:diff <name>`.
[experimental.pgdelta]
enabled = true
declarative_schema_path = "./schemas"
