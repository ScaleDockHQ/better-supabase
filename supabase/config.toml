project_id = "better-supabase"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# New tables get no Data API grants until 090_grants.sql gives them.
auto_expose_new_tables = false

[db]
port = 55422
shadow_port = 55420
major_version = 17

# Declarative schema files, in dependency order. Generate a migration after an
# edit with `supabase db diff -f <name>` while the local stack is stopped.
[db.migrations]
schema_paths = [
  "./schemas/010_extensions.sql",
  "./schemas/015_shared.sql",
  "./schemas/020_types.sql",
  "./schemas/030_crm/*.sql",
  "./schemas/040_rbac.sql",
  "./schemas/050_functions.sql",
  "./schemas/060_realtime.sql",
  "./schemas/070_storage.sql",
  "./schemas/090_grants.sql",
]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.customer-logos]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
# The nextjs example under `pnpm dev:portless`, and under `pnpm dev`.
site_url = "https://example.localhost"
additional_redirect_urls = [
  "https://example.localhost/**",
  "http://localhost:3100/**",
  "http://127.0.0.1:3100/**",
]
jwt_expiry = 3600
# Created by `better-supabase keys` (CI runs it before `supabase start`).
signing_keys_path = "./signing_keys.json"
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Adds the `user_role` claim (supabase/schemas/040_rbac.sql).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/rbac/custom_access_token_hook"

[studio]
enabled = false
port = 55423

[inbucket]
enabled = false
port = 55424

[analytics]
enabled = false
port = 55427

[db.pooler]
enabled = false
port = 55429

[edge_runtime]
enabled = false
